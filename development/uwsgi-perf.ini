[uwsgi]
; Perf-stack copy of docker/uwsgi.ini, which is only baked into the `final`
; image. The dev image has pyuwsgi installed but not the ini, and the stock one
; cannot be reused as-is: it binds https against certificate paths that exist
; only in the final image, and `strict = true` makes that fatal.
;
; Everything else is kept identical to docker/uwsgi.ini on purpose -- the point
; of measuring under uwsgi is that it is the server real deployments run.
http = 0.0.0.0:8080

strict = true
master = true
enable-threads = true
vacuum = true
single-interpreter = true
die-on-term = true
need-app = true

disable-logging = true
log-4xx = true
log-5xx = true
http-keepalive = 1

; Same as docker/uwsgi.ini. With two physical cores allocated to this service,
; 2n+1 would be 5; 3 keeps a worker's worth of headroom on the box.
processes = 3
listen = 128
buffer-size = 4096
