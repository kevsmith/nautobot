title: A cable create costs 220 queries, and what that broke downstream
site: perf/probe_cable_bulk.py - perf/capture_proxy.py
summary: 'Creating one cable with real terminations costs ~220 queries and 0.34 seconds,
  linear from 25 to 96 cables per request with no batching advantage in queries at all. That
  is five times what the write screen reports for dcim.cable, because the screen''s generated
  payload leaves both terminations null and a cable connected to nothing skips every
  termination check and cable-path walk. The cost is also why every datacenter apply logged
  16 failed bulk creates: 100 cables takes 35.6s over HTTP against databot''s 30s client
  timeout.'
result:
