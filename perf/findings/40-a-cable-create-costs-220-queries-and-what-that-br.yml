note: 'Three wrong turns, and each was wrong in a way worth writing down.


  **The first reproduction succeeded and proved nothing.** A 100-cable array POST built by the
  payload generator returned 201 in 7.8s, in-process and over HTTP. It was measuring a cable with
  no terminations. The tell was in the response -- termination_a_type: null -- and it was visible
  the whole time.


  **The second reproduction also succeeded, and the timing is what redirected it.** Real
  terminations gave 201 in 35.6s over HTTP. A request that takes 35s and succeeds, against a
  production failure that gave up at what the uwsgi log called 8.5s, looked like two different
  events. It was the same event: uwsgi''s msecs figure is not measured from request start, and
  keying on it cost an hour. The client-side number -- curl exit 28 at exactly 30.0019s against
  a 30.0s default -- is what settled it, and it was available from the start.


  **Reading the server''s logs could not have worked.** Django logs "Internal Server Error" for
  these and Nautobot''s exception middleware renders the traceback into a 246-byte body, so
  neither the container log nor databot''s warning ever says what broke. The capture proxy exists
  because the only copy of the evidence was in flight between two processes.


  **A fourth wrong turn, caught by Kevin rather than by me.** I read the clean final row counts
  -- exactly 1,648 cables, no duplicates -- as evidence that the timed-out transactions rolled
  back. They are equally consistent with commit-then-confirm, which is what the "skipped 1,600
  (resumed)" line said all along and what actually happened. Having decided on rollback, I then
  costed the timeouts as 480s of discarded work and published an adjusted figure built on it.
  The row count was real evidence for a claim it did not distinguish between.


  **Consequences.** databot now defaults to a 120s write timeout with a --write-timeout flag.
  120 rather than 60 because this host is already ~2x slower than the one Kevin measured on, and
  60s only covers a machine 1.7x slower than this one; the safe batch is roughly timeout x 0.8 /
  0.36s / slowdown. The timeout value stops mattering if the client halves the batch and retries
  on timeout instead of dropping straight to per-row -- recorded, not queued.


  **For Nautobot, the standing number is 220 queries per cable.** That is not a client problem
  and no fix on this branch touches it. It is the most expensive per-object create measured
  anywhere on the write surface, and it is now the strongest candidate at the top of the write
  ranking.'
