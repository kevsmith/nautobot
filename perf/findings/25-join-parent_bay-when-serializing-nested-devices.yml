title: Join parent_bay when serializing nested Devices
site: nautobot/dcim/api/views.py InterfaceViewSet
summary: DeviceSerializer pulls parent_bay in explicitly, because it is the reverse side of
  DeviceBay.installed_device and DRF does not auto-include it. A reverse one-to-one costs
  one query per Device unless it is joined, and at ?depth=1 each row on the page has its own
  Device instance -- so a 100-row page paid exactly 100 dcim_devicebay queries. select_related(device__parent_bay)
  on the viewset joins it.
result:
  queries: api.interface.depth1 292 -> 192 (-100, exactly as attributed); Tier 1 total 957
    -> 857 (-61.7% from baseline)
  duplicates: total 346 -> 247
wall_clock: −5.8% api.interface.depth1
wall_clock_detail: 'api.interface.depth1 1808.3 -> 1703.9ms (-5.8%), median of three separate
  runs of 15 reps on a quiesced host, spread 0.7% across rounds. All 13 other benched endpoints
  flat within +-1.6%. The before-state is the round-two baseline bench, which is this experiment''s
  immediate predecessor on the same host.


  Worth reading alongside the query figure rather than instead of it: removing 34% of the
  endpoint''s queries bought 5.8% of its wall clock, about 1ms per query. That is consistent
  with this branch''s finding that a query costs ORM round-trip overhead rather than SQL time
  -- total database time across the whole run moved 601ms to 602ms while query count fell
  57%.'
