title: Select_related the device list's primary IPs, which its own table cannot see
site: nautobot/dcim/views.py DeviceUIViewSet.get_queryset — nautobot/core/tables.py:277
summary: '`DeviceTable`''s `primary_ip` column renders a *property*, and the select_related that
  `BaseTable` derives from a table''s columns walks each accessor through
  `model._meta.get_field()`, which raises FieldDoesNotExist for a property and abandons the walk.
  The table''s own machinery therefore never sees `primary_ip4`/`primary_ip6`, and every rendered
  row paid a point lookup: exactly 100 `ipam_ipaddress` queries on a 100-row page, all issued from
  `dcim/models/devices.py:1011`. The list action now select_relates both FKs, as `retrieve` always
  has.'
