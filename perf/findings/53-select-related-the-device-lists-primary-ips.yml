wall_clock: "−14.3% ui.device.list.rows, conservative figure"
wall_clock_detail: 'Three alternating rounds (A/B, B/A, A/B) through measure.sh on a quiesced host,
  nine reps per arm with one warm-up discarded. Arms proven distinct by nautobot/ content hash,
  e4f5405d23a05d09 against 422d3c225be16121.


  **The conservative figure is the one quoted, and deliberately.** By mean of round medians the
  headline scenario reads −16.7%; by minimum it reads −14.3%. Arm A''s round-to-round spread is
  5.2% against arm B''s 0.9%, so the mean is partly an artifact of where one of A''s three noisy
  rounds lands, and the minimum is the defensible end. The noise asymmetry is itself coherent: arm
  A issues 100 extra point lookups and that is where the variance comes from. Range across the
  four target scenarios: −9.4% to −14.3% on the minimum, −9.9% to −16.7% on the mean.


  Ordering bias is ruled out rather than assumed. Arm B ran second, first, and second across the
  three rounds and was faster in all of them; the effect (~127ms) dwarfs the ordering variation
  (~5%, ~38ms). Per finding 26 that is the direction of evidence worth trusting.'
note: '**The instrument had to be fixed before the experiment could start, and the defect was
  silent.** `attribute.py` read only `url` from the workload row and dropped `headers`. Nautobot
  defers row rendering to an HTMX follow-up, so `ui.device.list` and `ui.device.list.rows` share
  the path `/dcim/devices/` and differ only by `HX-Request` — which meant every `.rows` attribution
  ever run through that instrument described the chrome page instead. Both scenarios reported the
  same 9 queries and no `dcim_device` query at all, against a table that renders 100 rows: a
  plausible-looking attribution of a page the instrument was not measuring. Fixed in afaf66fdf.
  `perf/findings/` was grepped and no finding cites attribute.py, so nothing already published is
  affected. This is the fourth instrument defect on this branch to produce a confident zero rather
  than an error, after the three hook-placement mistakes.


  **The same blind spot has three more instances and none is measured.**
  `VirtualMachineUIViewSet` select_relates `tenant__tenant_group` only and has `primary_ip` among
  its default columns; `VirtualDeviceContextTable` declares the same property column; and the
  `primary_ip` property exists twice in dcim/models/devices.py, on Device at 1006 and on
  VirtualDeviceContext at 2330, plus once more on VirtualMachine. Neither VM nor
  VirtualDeviceContext appears in the workload, so the cost there is inferred from shape rather
  than measured.


  **The general fix is better and is deliberately not taken here.** Teaching core/tables.py to
  honour an explicit select_related hint on a property-backed column would fix all four sites at
  once, in one place, and would stop the next property column from silently reintroducing the same
  N+1. It also touches the table machinery every list view in Nautobot uses, which makes it a
  separate experiment with a far wider blast radius rather than something to fold into a
  two-line viewset change. Logged as a queue candidate.'
