title: Extract BaseTable.replace_queryset from add_conditional_prefetch
site: nautobot/core/tables.py BaseTable.replace_queryset
summary: '`add_conditional_prefetch` already knew how to rebind a table to a new queryset — assigning
  `self.data.data` is not enough, because `self.rows` still wraps the previous `TableData`. That
  logic is now a public `replace_queryset()`, so a subclass can optimize further after
  `super().__init__()` has run, which is the only point at which the auto-optimized queryset exists
  and the visible columns are known. **Ported from Ken Celenza''s `867cb152e`
  (`UI | BaseTable | 8`)** on github.com/itdependsnetworks/nautobot.'
