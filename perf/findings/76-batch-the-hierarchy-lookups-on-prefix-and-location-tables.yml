title: Batch the per-row hierarchy lookups on Prefix and Location tables
site: nautobot/ipam/utils/__init__.py - nautobot/ipam/tables.py - nautobot/dcim/tables/locations.py
summary: '`PREFIX_COPY_LINK` and `LOCATION_TREE_LINK` render one indent per ancestor and an expand
  arrow when a row has children, and asked each row for both — `record.ancestors.count` and
  `record.children.exists` per rendered row. Locations now read the `tree_depth` annotation the
  tree-fields queryset already carries and resolve `children_exists` for the page in one query;
  prefixes are not a tree-fields model, so `prefill_prefix_hierarchy_ui()` walks the `parent` chain
  one query per tree **level**. **Ported from Ken Celenza''s `f047b8d47` and `ecdfdf4ea`
  (`UI | Tables | 1` and `3`)** on github.com/itdependsnetworks/nautobot.'
