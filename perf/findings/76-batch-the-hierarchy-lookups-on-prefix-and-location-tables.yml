note: '**The two halves are shaped differently and only one is a tree.** Location is a
  `tree_queries` model, so the depth is already annotated on every row and the fix is to read it.
  Prefix is not: IPAM maintains `parent` as the closest containing prefix, so the prefill walks that
  chain a level at a time, which is bounded by tree depth rather than by page size. Both land at a
  flat query count, by different routes.


  **The synthetic rows needed handling or the fix would have been partial.** Prefix tables inject
  "available" rows that are not in the database and bypass table optimization entirely; they now
  seed their own hierarchy values, which are known by construction. `add_available_prefixes()` also
  asked each container whether it had descendants — one query per container — and now answers that
  for every container on the page at once.'
