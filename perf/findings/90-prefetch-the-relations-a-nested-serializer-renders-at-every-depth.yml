  **The first version of this change regressed, and the cache is the fix.** Uncached, `get_queryset()`
  walked its own serializer instance -- separate from the one that renders the response -- and so
  built every nested branch, including branches null on every row that the renderer never builds.
  Two rounds of that version read `dcim/front-ports` at depth 3 31 -> 331ms on a page of zero rows
  and `tenancy/tenants` +40%, with identical queries. The cached version reads front-ports 32 -> 32
  and tenants 52 -> 52, and devices d3 improved further, −21% uncached to −34%.'
