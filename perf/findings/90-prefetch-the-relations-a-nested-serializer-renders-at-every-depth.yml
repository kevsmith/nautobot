caveat: 'Tier B2: a module-level cache that outlives the request. It is correct while a serializer
  class''s fields depend only on the keyed inputs -- class, lookup prefix, `include`, `exclude_m2m`,
  method -- which holds for `OptInFieldsMixin` and for app serializers registered at startup. A
  serializer whose fields vary on anything else (the user, a setting changed at runtime) would get
  the prefetch set computed for the first request that reached it. The failure is bounded: an entry
  can only add or omit a prefetch, so the worst case is an extra query or a missed one, never a
  changed response. Bounded at 1,024 entries because `include` is free text from the request.'
note: 'The device list is the case this does least for, and the database run says why. Its Postgres
  cost is planning, not row fetches, and planning is set by the first-level JOIN that this change
  leaves alone. Two routes at that floor are open: prefetching the first-level FKs instead of
  JOINing them, which trades one wide plan for several narrow ones, and the queued psycopg 3
  prepared-statements experiment, which plans once per connection.


  Measured with two probes added for it: `perf/scripts/probe_depth.py` (queries, canonical-JSON
  hash and in-process wall per endpoint and depth) and `perf/scripts/probe_db_load.py`
  (pg_stat_statements deltas around a cassowary run). `track_planning` was turned on for the
  database run and off again after it.'
