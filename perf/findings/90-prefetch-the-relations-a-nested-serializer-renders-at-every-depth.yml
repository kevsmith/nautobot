title: Prefetch the relations a nested serializer renders, at every ?depth
site: nautobot/core/api/views.py `nested_prefetch_lookups` / `ModelViewSetMixin.get_queryset`
summary: 'The REST optimizer walked only the root serializer''s fields. A nested serializer renders
  its related object in full, including that object''s own relations: at `?depth=2` an IP address
  renders its parent Prefix, and the Prefix renders its Status, Namespace and Tenant as nested
  serializers too. Nothing below the first level was prefetched, so each of those relations was
  fetched one query per row, 606 queries for a 100-row page of IP addresses at depth 2 and 1,506 at
  depth 3.


  `nested_prefetch_lookups()` walks each nested serializer''s fields recursively and prefetches every
  relation rendered from the related row: nested FKs, to-many fields and their nested children,
  GenericForeignKeys, and the natural-key walk behind `display`. A depth-0 leaf FK renders `{id,
  object_type, url}` from the FK column through DRF''s pk-only optimization and needs nothing. The
  walk is cached per process, keyed on the serializer class, lookup prefix and the request''s
  `include`, `exclude_m2m` and method.


  **Held off `perf/recommended` by decision.** Measured and kept on `perf/experiments`; the full
  suite has not been run on it.'
