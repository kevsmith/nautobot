  the third. Two query counts varied by one between rounds, power-feeds d3 on the base arm and
  console-ports d3 on the change arm, so neither is the change.'
tests: 'core, ipam, circuits and dcim `test_api`, serial: 75 + 558 + 168 + 1,737 = 2,538 OK, run on
