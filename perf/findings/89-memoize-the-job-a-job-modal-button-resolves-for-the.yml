title: Memoize the Job a job-modal button resolves, for the duration of the request
site: nautobot/core/ui/object_detail.py `_JobModalButton.build_trigger_context` / `_get_job`
summary: '`_JobModalButton.build_trigger_context()` resolved its Job with
  `Job.objects.restrict(user, "view").get_for_class_path(...)` on every rendered trigger, to decide
  whether the trigger is disabled. The device lists render the export trigger twice, so the
  identical permission-filtered query ran twice per page.


  The lookup is a pure function of `(class_path, user)`, so it memoizes into the `request_cache()`
  scope the middleware already opens around every request. The `Job.DoesNotExist` outcome is
  memoized too, or a disabled trigger goes on querying once per render.


  **This removes a duplicate, not the lookup.** It is the smaller half of finding 88 and does not
  undo it.'
