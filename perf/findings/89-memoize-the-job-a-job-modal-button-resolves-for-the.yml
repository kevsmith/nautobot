caveat: 'The memoized value is **permission-filtered**, so the B1 argument rests entirely on the
  memo''s scope being one request and one user. That holds because `request_cache()` is opened in
  exactly one place in the product tree, `nautobot/core/middleware.py:117`, which wraps a single
  HTTP request. An app or a future caller that opened a `request_cache()` scope around anything
  broader -- a job run iterating users, a management command, a batch -- would make a Job''s
  view-permission decision outlive the user it was computed for. Anyone adding a second opener
  needs to read this.


  `None` and an `AnonymousUser` both have no pk and are deliberately keyed differently, because
  `user=None` skips the object-level restriction entirely and is therefore not the same lookup.


  Nothing else changes: same query, same disabled state, same rendered markup. The disabled-reason
  branches are reordered to read from a returned `None` rather than from a caught exception, and
  are otherwise identical.'
note: '**This is the small half of finding 88, and it is worth being plain that it does not close
  it.** #9501 added 22 queries across the 57-scenario read loop; this returns 4. The other 18 are
  one lookup per list view with nothing to collapse them against.


  **What would reach them, and why it was rejected.** A cross-request cache -- Redis via
  `cache_get_or_set()` -- is the only option that touches all 18. Its key must include the user,
  and its invalidation would have to cover Job enable/disable, permission grants and group
  membership. That is an unbounded staleness window on an authorization decision: B2 plus
  `security-visible`, and the same shape as the per-user nav-menu cache this branch already
  rejected (finding 19). Not measured, rejected on risk.


  **Also rejected: a per-instance memo** (`self._job`), which produces the identical −4.
  `_JobModalButton` instances are module-level singletons registered in
  `registry["job_modal_buttons"]` at import, so an instance attribute outlives every request and
  would serve the first user''s permission-filtered result to every subsequent user for the life of
  the process. Same counter, B2 plus `security-visible` instead of B1.


  **And: stopping the device lists rendering the trigger twice**, which fixes the duplication at
  source for the same −4. Rejected as tier C against tier B1 for an identical counter -- it changes
  rendered output, and this does not.


  The commissioning brief for this experiment predicted the +1 would disappear from every list
  view. It was wrong, and the shape probe is what established that rather than any reading of the
  code.'
