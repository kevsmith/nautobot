tests: n/a; harness only, no product code
caveat: null
note: '**Second time in one session this script has been wrong in the same direction, and the
  shape is identical.** Finding 80 was a removal set computed against the wrong reference; this is
  a hash computed over the wrong file set. Both produce a check that looks satisfied and covers
  less than it claims. A gate that cannot fail is worse than no gate, because it is trusted.


  **What generalises is the question rather than the fix.** For every check this harness performs,
  the useful question is not "does it pass" but "what could change without it noticing". `nb_hash`
  would still not notice a change to `development/`, to `pyproject.toml`, or to a static asset --
  all of which can alter what is measured. The answer for those is that the arm swap does not
  touch them, which is true today and is exactly the kind of assumption that was true of templates
  until a template-only arm was built.'
