title: The content hash that proves two arms differ was blind to templates
site: perf/scripts/arm_control.sh
summary: '`arm_control.sh` prints a content hash after every swap, and the protocol leans on it
  for one thing: proving the two arms of an A/B are not the same code. A `git stash` A/B once
  measured identical code six times without noticing, and this hash is the answer to that. It
  hashed `nautobot/**/*.py` and nothing else, so **a change confined to a template armed
  invisibly** -- two arms differing only in a `.html` file printed the same hash, and the proof
  read as satisfied while proving nothing.'
result:
  how_it_surfaced: 'three arms built to price finding 83 -- baseline, filter drawer stubbed, every
    hidden drawer stubbed -- differ only in `generic/object_list.html`. All three printed
    `368a99a0401538e6`. The measurement was sound and its arms were genuinely different, but
    nothing in the run could demonstrate that.'
  no_published_figure_is_affected: 'audited every accepted product finding for commits touching
    non-`.py` files under `nautobot/`. Two exist, findings 51 and 58, and **both also change
    `.py`** -- `core/context_processors.py` in each case -- so their hashes moved and their arm
    proofs held. **Zero template-only accepted findings.** The hole was real and had not yet been
    stepped in.'
  the_fix: '`nb_hash` now covers `*.py`, `*.html` and `*.txt` under `nautobot/`, still excluding
    `project-static`, which is build output whose presence depends on whether docs happen to have
    been built. The four branches in play hash distinctly where three of them previously collided:
    `066de3e628910b30`, `0595bd3b2bc7aaa4`, `46375107474b8e2a`, `ede0380f56d26552`.'
  the_stubbed_arms_verified_after_the_fact: 'arming is deterministic from the ref, so re-arming
    each of the three after widening the hash proves what the original run could not: distinct
    hashes, and the template carrying 1, 0 and 0 calls to `filter_form_drawer`.'
