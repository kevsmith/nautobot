title: Findings 90 and 91 together double device, IP address and prefix throughput at depth 2
site: nautobot/core/api/views.py and development/nautobot_config.py `DATABASES["default"]["OPTIONS"]`
summary: 'Finding 90 removes per-row queries below the first nested level; finding 91 removes
  Postgres planning by preparing statements on pooled psycopg 3 connections. They act on
  different parts of a request, and this run measures them as a 2x2 on one rig: `perf/recommended`
  or `perf/scratch-f90` (`perf/recommended` plus 389f40beb), each on psycopg2 with a connection
  per request or on finding 91''s arm D.


  **Together they cut median latency 39-57% on every device, IP address and prefix cell and
  20-25% on interfaces, and every cell is better in all three rounds.** On the device list at
  depth 2 and 3 the gains multiply: at depth 2, one client, finding 90 alone is 0.49 -> 0.69 req/s
  (+41%), finding 91 alone 0.49 -> 0.67 (+37%), both 0.49 -> 1.06 (+116%).


  **Held off `perf/recommended`**, as findings 90 and 91 are.'
