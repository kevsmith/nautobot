note: 'This is finding 32''s conclusion arriving on a second instrument. There it was Tier 1W --
  a recurring GC pause meant no wall figure below a few hundred milliseconds meant anything, and
  three alternating rounds could not cancel it. Here it is the write screen, the mechanism is
  whatever jitter a 40ms request carries rather than a GC pause specifically, and the boundary
  lands in the same place. Two instruments, independently, put the usable floor at a few hundred
  milliseconds.


  **The practical consequence is a reporting rule rather than a code change.** A per-measurement
  wall figure should not be published without its absolute magnitude alongside it, and a range
  across measurements should not be published at all on this axis: quoting "wall clock ranged from
  −59.8% to +42.5%" would advertise a 42% regression that is noise, on a comparison whose
  aggregate is −23.9%. The aggregate is unaffected -- it sums absolute milliseconds across 260
  measurements, where the small ones contribute little and their jitter cancels.


  **What the banding also shows is not noise.** The median improvement rises monotonically with
  the cost of the operation: −4.7%, −15.7%, −38.1% across the three bands. The expensive half of
  the write surface is where this branch does its work, which is the half a user waits on. That
  belongs in a conversation about where the wins are rather than in the report, where a band table
  needs the reader to already know the test environment.'
