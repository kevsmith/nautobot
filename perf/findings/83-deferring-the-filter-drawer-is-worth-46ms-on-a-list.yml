caveat: '**This is an upper bound and not a forecast.** Stubbing removes the work; deferring only
  moves it. The page-load saving is real, but whoever opens the drawer pays for it on the fetch,
  so the value of the change rests on most users never opening filters -- which nobody here has
  measured, and which no instrument on this branch can measure.


  **The device figure is softer than the prefix one.** Its two stub arms spread 7.1% and 8.1%
  across rounds against prefix''s 3.6% and 5.3%. Read -46.0ms as firm and -33.0ms as indicative.


  **An inversion appeared and dissolved, which is why the rounds are not optional.** After one
  round, removing all three drawers read *slower* than removing just the filter drawer on device,
  150.8 against 140.3. It held through a second reading and then dissolved on the third, when the
  drawer-only arm read 150.2. A mechanism was nearly offered for it; the branch''s own history
  has a 2ms and an 11% regression dissolving on a third round, and this is the third.'
note: '**Status is `priced`, not `accepted`: nothing is proposed here.** The measurement says what
  the idea is worth, not that it should be taken. What it costs is a behaviour change, and the
  three questions belong to whoever decides it rather than to a measurement:


  *Without JavaScript the filter form disappears.* This is nearly free as positions go, because
  the list view already renders zero rows without JavaScript -- `queryset if htmx_request else
  queryset.none()` -- so the page is already non-functional there. The change does not newly take
  that position, it inherits it.


  *A deep-linked filtered URL needs to show filter state before the drawer is opened.* The
  indicator that does this today renders inside the drawer, so something outside it has to.


  *The request has to be disambiguated, and that is the hard part.* The table already fetches the
  same URL with `hx-get=""` and `hx-params="*"`, distinguished only by `HX-Request`, so that
  header is taken. A discriminator is needed, it has to be registered in `NON_FILTER_PARAMS` or
  the view reports "Invalid filters were specified", and `Vary` has to cover it or a cache serves
  a fragment where a page belongs.


  **A dedicated endpoint looks like the clean answer and is not.** The drawer''s content is a
  function of the *view*, not the model: `renderers.py:236` reads `view.filterset_form_class`, and
  119 views override it. An endpoint addressing a model cannot see those overrides, and would have
  to recompute permissions, `filter_params` and saved-view state in a second code path that must
  agree with the first forever. Same URL plus a discriminator keeps all of that inherited. The
  precedent is already in the file: `renderers.py:307` does exactly this for detail views, with
  `HX-Request` plus `component_id`.'
