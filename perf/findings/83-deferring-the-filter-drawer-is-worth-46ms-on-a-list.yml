title: Deferring the filter drawer is worth 46ms on a list view, measured by removing it
site: nautobot/core/templates/generic/object_list.html - nautobot/core/templatetags/helpers.py filter_form_drawer
summary: 'Finding 82 attributed 36-46ms of a list view document to a filter drawer that is closed
  until clicked. Attribution says where time is spent; it does not say what removing the work
  would return, because a saving can be absorbed elsewhere. This measures the ceiling by deleting
  the drawer outright on a throwaway arm, before anything is designed or built.


  The idea is Kevin''s and it is better than the one it displaces: rather than making the drawer''s
  markup cheaper to render, do not render it on page load at all, fetching it when the user opens
  it. Nautobot already does exactly this for table rows.'
