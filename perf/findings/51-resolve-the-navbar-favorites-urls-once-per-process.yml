caveat: 'Tier B2: a module-level global that outlives the request. It holds two URL strings and is
  populated on first use, when the URLconf is loaded and the script prefix is known. It is
  correct only while both of its inputs are stable for the process, and both were checked:
  nothing in the tree sets `request.urlconf`, and the script prefix comes from static deployment
  configuration, with FORCE_SCRIPT_NAME making it constant by construction where a sub-path is
  served.


  **There is no invalidation, deliberately.** A guard comparing the cached prefix against
  get_script_prefix() costs ~1us instead of 0.18us and was considered and left out, on the
  grounds that neither production nor the test suite changes the prefix mid-process — the single
  use of override_script_prefix in the tree issues no requests. If a future test renders a page
  under FORCE_SCRIPT_NAME, this global will serve the wrong prefix and that test will fail; the
  fix is the two-line guard, and it is worth knowing that is the failure mode rather than
  discovering it. Given #3891 was a real bug about hard-coded URLs versus that setting, someone
  adding such a test is plausible.'
note: 'Found while attributing finding 50''s ~47ms of chrome. That finding established
  nav_menu.html costs 46.2-48.4ms on every page and that construction is only 1.1ms; this says
  where roughly 28ms of the rendering went. The remaining ~20ms is ordinary Django template
  interpretation across 180 items and is not addressed here.


  This is the fifth instance on this branch of work done per item that could be done once, after
  findings 07, 11, 12 and 34.


  **Not done here.** inc/nav_favorites.html:21 has the same `{% url %}` inside a loop over the
  user''s favourites. The measurement user has none, so including it would have put an unmeasured
  change in a measured commit. Same pattern, same one-line fix.


  Two things worth knowing if this is revisited. The favourites are identified by a body field
  (`link`) rather than a URL segment, which is why both URLs are argument-free and therefore
  memoisable at all; a move to `DELETE /user/navbar-favorites/<pk>/` would make them 123
  genuinely distinct reversals and this optimisation would evaporate. And core/urls.py mounts
  nautobot.users.urls twice, at user/ and at users/, which is why namespace resolution costs
  ~15us of every namespaced reversal in the application — logged in queue.md rather than fixed.'
