    32.6ms against ~47ms — and is also the noisiest arm at 4.4% spread, so the agreement there is
    weaker than the other three and is not claimed as confirmation.'
  scope: 'one per row on every list view that shows a tenant, not a device-list problem. The
    compile site differs by view class — core/views/renderers.py:386 for UI viewsets,
    core/views/generic.py:442 for the legacy path — while the column is the same.'
  equivalence: 'response bodies byte-identical between arms on all six scenarios, targets and
    controls alike. The two implementations differ only in whether the parse is repeated.'
  not_a_cross_request_cache: 'the compiled template is cached on the column instance and
    django_tables2 deep-copies columns per table instance, so this is ~1 compile per column per
    request rather than a process-wide cache. That is why arm B reads 5 compilations per page and
    not 4, and it is why the change carries no cache-scope question.'
