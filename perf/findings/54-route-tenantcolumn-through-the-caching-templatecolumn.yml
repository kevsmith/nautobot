title: Route TenantColumn through the caching TemplateColumn
site: nautobot/tenancy/tables.py:28 — nautobot/core/tables.py:422
summary: '`django_tables2.TemplateColumn.render()` ends in
  `return Template(self.template_code).render(parent_context)`, and `Template(...)` is the compile
  step — `Template.__init__` runs the lexer and parser over the source. Upstream calls it inside
  `render()`, so a column re-parses its fixed template once per cell.
  `nautobot.core.tables.TemplateColumn` exists to fix exactly that (findings 07 and 11), compiling
  once and caching on the instance. `TenantColumn` was declared against `django_tables2`''s class
  instead, so the caching never applied to it and every list view showing a tenant paid ~100
  compilations per page. One-line fix; the caching class was already imported in that file.'
result:
