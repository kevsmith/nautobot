wall_clock: "−4.5% ui.device.list.rows, conservative figure"
wall_clock_detail: 'Three alternating rounds (A/B, B/A, A/B) through measure.sh on a quiesced host,
  nine reps per arm with one warm-up discarded. Arms proven distinct by nautobot/ content hash,
  0d4d5a498c01d7f9 against f5254d8b00ac0eee.


  **The controls are what set the figure.** Raw means give −4.9% to −6.2% across the four
  tenant-bearing scenarios, but both controls read −0.9% and −1.0% for a change that cannot have
  touched them, so roughly a point of that is systematic. Net of it the effect is −4% to −5%, and
  −4.5% (the minimum-based figure on the headline scenario) is quoted rather than the −6.1% mean.


  Ordering bias is ruled out rather than assumed: arm B ran second, first and second across the
  three rounds and was faster in all of them.'
caveat: 'Flagged `third-party-coupled` for the same reason `nautobot.core.tables.TemplateColumn`
  itself is: it reimplements `django_tables2.TemplateColumn.render()` rather than extending it, so
  it depends on the parent''s `get_context_data()` hook keeping both its name and its render
  semantics. This change widens the surface that depends on that from the columns already using the
  caching class to `TenantColumn` as well, which is most list views in the product. The existing
  `CachingTemplateColumnCouplingTestCase` is the guard — it compares the two implementations''
  output directly, so a django_tables2 upgrade that changes `render()` semantics fails a test
  rather than silently producing wrong cell content. Anyone taking a django_tables2 major version
  should read that test''s docstring first. No API, UI, or export behaviour changes here: the
  rendered bytes are identical.'
note: '**The hypothesis that led here was half wrong, and the instrument is what separated the
  halves.** `probe_page_phases.py` reports a template named `<string>` — Django''s origin for a
  Template built from a source string — at 61.2ms over 6 renders on `ui.home` and 118.3ms over 500
  on `ui.device.list.rows`. 10.2ms for one small template render is ~40x what the file-backed
  templates in the same run cost, which looked like compilation happening per render. So
  `probe_string_templates.py` was written to time construction and rendering separately.


  For `ui.home` the hypothesis is **wrong**: 6 renders cost 61.2ms while all 6 compilations cost
  3.3ms. That cost is in resolving `{{ connections... }}` inside
  `nautobot/core/views/__init__.py:113 render_additional_content`, which runs in the view rather
  than the render phase — which is also why page_phases showed `render=39.0ms` against a larger
  `<string>` exclusive figure. Unexplained and logged; it is a different problem from this one.


  For the list views it is **right**, and broader than the page that prompted it: four surfaces,
  not one.


  **Two more columns have the same defect and are deliberately left alone.**
  `DeviceComponentNameColumn` (dcim/tables/template_code.py:6) and `JobResultColumn`
  (extras/tables.py:1029) also subclass `django_tables2.TemplateColumn` directly. Same one-line
  fix, but no workload scenario renders either, so their cost is unmeasured and claiming a saving
  for them would be guessing. Once all three are converted a structural test — no shipped column
  subclasses django_tables2''s version directly — becomes possible, and that is the durable guard
  against the next one. Logged as a queue candidate.'
