title: Fetch the filter drawer when it is opened instead of rendering it into every page
site: nautobot/core/views/renderers.py - nautobot/core/templates/generic/object_list.html - nautobot/core/templatetags/helpers.py filter_form_drawer
summary: 'Finding 82 attributed 36-46ms of a list view document to a filter drawer that is closed
  until clicked, and finding 83 priced removing it. This defers it instead: the document carries
  the drawer''s shell and the contents arrive on first open, which is what Nautobot already does
  with table rows. Kevin''s idea, and it beats the change it displaces on every page.


  **Both IPAM list views now render in under 100ms in-process**, from ~140ms.'
