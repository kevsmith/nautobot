  Attribution checked rather than assumed: finding 85, landed the same night, passes
  `FilterFormsTestCase` alone, so all 109 belong to this change.


  Its own 6, in `nautobot.core.tests.test_views.DeferredFilterDrawerTestCase`: The document
  carries the shell and not the contents, asserted on the drawer''s own tab strip rather than on
  the absence of a `<select>` -- a page whose filter form has no selects would pass that by
  accident. The fetch returns contents without the shell, since the swap is innerHTML and
  returning the section would nest a drawer inside itself. The marker alone does not trigger a
  fetch. The marker is not read as a filter. The fetch keeps the page''s filters. And the
  response varies on `HX-Request`. They were the wrong tests to write first: they cover what
  the change does and not what it stops doing.'
caveat: '**Tier C: this is a behaviour change, not a transparent optimisation.** The filter form
  is absent from the document until opened, and unavailable without JavaScript.


  **The JavaScript question is decided, not open.** A Nautobot list view already renders zero
  rows without JavaScript -- `queryset if htmx_request else queryset.none()` -- because the table
  is fetched asynchronously over HTMX, so no list page is usable without it today. The drawer
  inherits that position rather than taking it, and Kevin accepted it on that basis.


  **The saving is deferral, not removal.** Whoever opens the drawer pays the ~46ms then. The
  value rests on most users never opening filters, which nobody here has measured and no
  instrument on this branch can. The template also executes once per page load, not once per
  session, so navigating between list views pays it again on each first open.


  **The measured combined arm is not byte-identical to what landed.** It carries both product
  changes and neither test suite, because it was branched before the tests were written. Test
  code never executes during page rendering, so the timing is unaffected.'
note: '**Six defects, and every one was invisible to the checks I had written.** Byte-equality
  proved the fetched HTML matched the inline HTML and could not see that the markup was inert;
  HTTP status and byte counts proved a response arrived and could not see that a `TemplateSyntaxError`
  had made it a 500. In order: multi-line `{# #}` comments rendering into the output, since that
  tag is single-line only; the `htmx` global not yet defined when the inline script runs, which
  aborted the block so the listener never registered; a page-load
  IIFE dereferencing a form that no longer exists at load; the re-init listener registered in a
  scope that could not see its callee, found only by reading the *rendered* page rather than the
  template; a `deferred` kwarg the tag did not accept; and `hx-get` rendering empty because an
  inclusion tag does not receive the parent context without `takes_context=True`.


  That last one worked anyway -- htmx treats an empty `hx-get` as the current URL, which is what
  the table''s row fetch relies on deliberately -- so it was right by accident until it was made
  right on purpose.


  **What found them was a person opening the page in a browser and reading the console.** The
  lesson is not that the checks were bad; byte-identity is exactly the right check for "does the
  fetch return the same markup". It is that a change which moves work from page load to a later
  fetch moves it across a boundary no server-side instrument observes, and the harness has no
  instrument on the far side of it.'
