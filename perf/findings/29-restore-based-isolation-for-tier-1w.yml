reason: Not worth changing, because the thing it would fix is not costing anything measurable.
  Rollback under-reports wall clock by 0.9% on a bulk create, inside variance, so Tier 1W's
  existing figures stand. Rollback also keeps Tier 1W fast enough to sit inside run_experiment.sh
  --writes as an inner-loop gate, where restore-based isolation would add ~70 seconds per
  arm.
note: 'What rollback omits is qualitative rather than quantitative, and that part is still
  true: transaction.on_commit callbacks never fire, and Nautobot uses them in five places
  including custom-field job enqueueing at extras/customfields.py:744. An experiment that
  changed commit-time behaviour -- deferring constraint checks, batching index maintenance
  to commit -- would measure exactly zero under rollback. Nothing on this branch has done
  that. Finding 24 is the near miss: index maintenance happens in-transaction, so rollback
  does see it.


  It also does not follow that rollback is fine for the write screening matrix. REST writes
  cross the process boundary, so a rolled-back transaction in the harness cannot isolate them
  at all. This result narrows that build rather than blocking it: the in-process ORM half
  can keep using rollback for speed, and only the REST half needs restore-based orchestration.'
