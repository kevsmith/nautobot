wall_clock_detail: 'bulk.create.interfaces.x100.deferred, three rounds each way with a snapshot
  restore before every arm so each started from byte-identical state, and arm order reversed
  between rounds. rollback 3389/3312/3407ms, commit 3343/3358/3367ms. Medians 3389 against
  3358 -- a 31ms difference on a 3.3-second operation, inside the run-to-run spread.


  The first attempt at this measurement was discarded, and the reason is the useful part.
  It ran three rollback reps then one committed rep, so the committed arm was fourth and warmest,
  and reported commit 5% FASTER. Reversing the arm order flipped the sign: in both round 1
  and round 3 the second arm won by ~46ms regardless of which arm it was. That is pure ordering
  effect, and it validated the arm-reversal rule within an hour of the rule being written.'
