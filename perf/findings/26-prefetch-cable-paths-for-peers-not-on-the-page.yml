note: 'Found by attribution, and attribution also killed the obvious version of the fix. Adding
  a cable_paths prefetch to the viewset would have measured exactly zero: Interface.connection_prefetch_related_fields()
  already declares a GenericPrefetch for cable_paths__destination. The queries were never
  a missing prefetch -- they are peers that are not page members, so the viewset''s prefetches
  never reach them, and the fix has to land where peers are fetched.


  Also disproved: .first() on a prefetched reverse FK does not clone the queryset and re-query.
  It costs 0 queries, so _first_cable_path''s memoization was never the bottleneck it resembled,
  and a fix built on that premise would have been wrong.


  Rollout candidates: the other PathEndpointMixin viewsets -- FrontPort, RearPort, ConsolePort,
  PowerPort -- serialize peers the same way and share the same helper. Left for a follow-up
  so this commit''s number stays attributable.


  **Retracted follow-up, and finding 30 is what retracts it.** This record used to claim that
  the depth guard withholds this fix from dcim.interface-connections -- that the endpoint
  ignores `depth`, never satisfies `depth > 0`, and so pays _first_cable_path and _destination
  50 times each on a page of 25, and that re-keying the guard on whether peers are serialized
  would fix both endpoints. It would not. With the guard deleted outright on an otherwise
  unchanged tree, interface-connections still costs 359 queries and those two sites still cost
  50 each: its page is CablePath rows, CablePath has no get_cable_peer, and _warm_peer_cable_paths
  therefore skips every row whatever the guard says. The guard here is measured, correct, and
  not involved in that endpoint at all. What actually fixed it was prefetching both ends of the
  connection from the viewset -- see finding 30, which carries the measurement.'
