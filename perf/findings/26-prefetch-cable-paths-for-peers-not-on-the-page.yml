note: 'The diagnosis is the useful part, and it overturned the obvious fix. Interface.connection_prefetch_related_fields()
  ALREADY declares a GenericPrefetch for cable_paths__destination, so adding a viewset prefetch
  would have measured exactly zero. Verified in isolation that the prefetch works when it
  applies: 20 interfaces cost 40 queries cold, 20 with prefetch_related(cable_paths), and
  0 with cable_paths plus its destination prefetched.


  The reason it does not apply is in finding 09''s own notes -- 83 of the 166 peer rows are
  root objects on the page and fully prefetched, and the other 83 are not. Peers reached through
  cable_peer are fetched individually via the request-scoped identity map, so they never receive
  the viewset''s prefetch. The fix belongs where peers are fetched, not on the viewset.


  Also disproved along the way: .first() on a prefetched reverse FK does NOT bypass the prefetch
  cache. It costs 0 queries, so _first_cable_path''s memoization is not the problem and never
  was.'
