title: Index maintenance on extras_objectchange, the hottest insert path
site: to be determined from pg_stat_user_indexes
summary: 'extras_objectchange carries at least eleven indexes, every one maintained on every
  insert, and it is the highest-insert-volume table in Nautobot. The write path is where the
  remaining cost sits: bulk.create.x100 is still 1,404 queries dominated by those inserts,
  and nothing on this branch has looked at index maintenance as a cost.'
