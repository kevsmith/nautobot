caveat: Dropping any index needs evidence from a workload that exercises the queries it serves.
  Coverage here is ~5% of the API surface, so scan counts from this workload under-represent
  real usage and cannot by themselves justify a removal.
note: '**Correction: an earlier reading of this was a measurement artifact.** A pg_stat_user_indexes
  query reported 1,205 of 1,234 indexes never scanned, which looked dramatic and meant nothing:
  those counters reset when the database is dropped and recreated, and restore_snapshot.sh
  had run seconds earlier. After actually running the workload the figure is 1,050 of 1,234
  -- still not evidence for removal at 5% coverage, but at least a real measurement.


  Adding indexes remains a dead end here, and that is measured rather than assumed: 325,152
  queries totalling 4.6 seconds, mean 0.014ms, and query count fell 57% while total DB time
  went 601ms to 602ms. api.prefix.list even spends 13.7ms planning a query that executes in
  1.3ms, where an index makes planning worse.


  Nautobot has no AddIndexConcurrently or RemoveIndexConcurrently anywhere in its migrations,
  so every existing index migration takes a table lock. Doing anything here safely on a large
  table means introducing that pattern.'
