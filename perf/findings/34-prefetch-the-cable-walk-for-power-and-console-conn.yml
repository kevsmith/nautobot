note: 'Finding 30 is why this was cheap, and specifically the part of it that refused a
  guess. Its record originally read that power- and console-connections were "almost certainly
  the same viewset shape, so one fix plausibly covers three endpoints"; the commit corrected
  that to "one fix covers one endpoint, the other two are a named follow-up, not a freebie".
  Both halves of the correction turned out to matter. The viewsets really are different, so
  the fix is not a copy -- but the underlying cost really is the same five call sites, so the
  prefetch set transfers exactly. Attribution settled in one command what neither guess would
  have.


  The shared helper is the whole change. `_interface_connection_endpoint_queryset()` became
  `_with_connection_prefetches(queryset)`, taking the queryset instead of building one, with
  the interface caller kept as a one-line wrapper so finding 30''s path is provably unchanged
  -- and its 17-query count in both arms of this experiment is that proof. Two of the seven
  sites (`_first_cable_path` and `_destination`) are paid only by interface-connections,
  whose serializer resolves each end''s cable path; prefetching `cable_paths__destination` for
  all three costs the other two nothing, since they already had it.


  Risk tier B1, no migration. The new state is prefetch caches on a queryset, which live and
  die with the request.'
