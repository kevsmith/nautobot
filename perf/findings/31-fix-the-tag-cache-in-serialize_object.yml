title: Fix the tag cache in serialize_object, which can never fire for an untagged object
site: nautobot/core/models/utils.py:220
summary: "serialize_object reads a cached tag list if one is present on the instance:\n\n\
  \    tags = getattr(obj, \"_tags\", []) or obj.tags.only(\"name\")\n\n`[] or X` evaluates\
  \ X, so an object whose cached tag list is empty falls through and queries anyway. Most\
  \ objects in a bulk write have no tags, so the cache can never fire for the common case."
result:
  queries: 20 interfaces cost 40 queries as-is and 20 with a truthy _tags -- half; the extras_tag
    lookup disappears entirely
  expected: 1 of the 2 queries per ObjectChange record, without touching object_data
wall_clock: −50% serialize_object (4.59 → 2.30ms per object)
wall_clock_detail: 'serialize_object over 20 Interfaces, measured directly: 4.59ms per object
  as-is, 4.13ms with _tags set to [] (unchanged, because the falsy check defeats it), and
  2.30ms with a truthy _tags -- a 50% reduction, matching the 40-to-20 query drop.


  Not a full experiment yet: this measures the ceiling of fixing the check, not a change written
  and gated. The remaining ipam_vlan query per object is Django''s serializer fetching the
  tagged_vlans M2M, which is inherent to serialize("json") rather than avoidable here.'
