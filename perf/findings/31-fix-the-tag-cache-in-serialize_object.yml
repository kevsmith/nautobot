summary: "serialize_object read a cached tag list if one was present on the instance:\n\n \
  \   tags = getattr(obj, \"_tags\", []) or obj.tags.only(\"name\")\n\n`[] or X` evaluates\
  \ X, so an object whose cached tag list was empty fell through and queried anyway. Most objects\
  \ in a bulk write have no tags, so the cache could never fire for the common case. Testing\
  \ for presence instead of truth makes it fire, and two callers can then populate it: a just-created\
  \ object provably has no tags, and the deferred change-logging flush can read the whole batch's\
  \ tags in one query instead of one per record."
