note: 'This is the Tier A route to roughly half of what finding 22 measured. Finding 22 removes
  the whole v1 serialization for 2 queries per record and is Tier C -- it changes the REST
  and GraphQL payload and needs 13 test updates. This removes 1 of those 2 queries and half
  the serialization time, changes no payload, and breaks nothing, because it makes an existing
  cache work as written rather than removing what it feeds.


  Two parts to the change: `getattr(obj, "_tags", None) is not None` instead of the falsy
  `or`, and populating `_tags = []` where the caller knows there are none. The create path
  in signals.py qualifies -- to_objectchange runs immediately after save and tags are assigned
  afterwards, so a newly created object provably has none.


  Found by asking why serialize_object costs what it does, which is a question I should have
  asked before proposing to delete its output.'
