title: The nav menu's cost is not a superuser artifact, and Django permissions are inert here
site: perf/scripts/probe_nav_menu_perms.py — nautobot/core/context_processors.py _build_nav_menu
summary: 'Findings 50 and 51 were all measured as `perfbot`, a superuser. That mattered because
  `_build_nav_menu` runs ~176 permission checks and Django''s PermissionsMixin.has_perm returns
  True from `is_active and is_superuser` *before consulting any backend* — so every check
  short-circuited, and "construction is 1.1ms, rendering is 44x more" could have held only for a
  user who pays nothing for permissions. Measured against a non-superuser seeing the same menu,
  it holds: construction doubles, rendering does not move.'
result:
  three_users: 'superuser: 200, wall 275.2ms, build 1.17ms, nav_render 20.6ms, 176 wrapper calls,
    **0** backend has_perm calls, menu 15/42/123. Broad non-superuser (ObjectPermission granting
    view on all 191 content types): 200, wall 256.8ms, build **2.45ms**, nav_render **20.2ms**,
    176 wrapper calls, **186** backend calls, menu 15/42/122. Limited non-superuser (6
    permissions): 403, wall 20.9ms, build 1.39ms, nav_render 1.2ms, 14 wrapper calls, 118 backend
    calls, menu 1/1/2.'
  verdict: 'construction 1.17 -> 2.45ms, roughly doubling; rendering 20.6 -> 20.2ms, unmoved. The
    ratio narrows from 44x to about 8x and rendering still dominates. Nothing built on "rendering
    is the cost, not construction" needs revising, and the −43% of finding 51 is unaffected
    because URL reversals do not depend on who is asking.'
  why_it_stays_cheap: '`objperm_loads=1` in both non-superuser arms. ObjectPermissionBackend
    loads the ObjectPermission set once per user object and caches it on `_object_perm_cache`, so
    186 backend checks are dict lookups against already-materialised data. `build_q=0`: the
    builder issues no queries during the request, because the permission load happens outside the
    timed section.'
  superuser_shortcut: 'the superuser makes **zero** backend calls for 176 checks. The 186-vs-0 gap
    is the entire cost of being a normal user, and it is 1.3ms.'
  pruning: 'the limited user''s menu prunes to 1 tab / 1 group / 2 items, and the permission tree
    short-circuits after 14 wrapper calls rather than 176 — a tab whose permissions fail never has
    its groups or items checked. So a *less* privileged user is cheaper, not dearer, and the
    expensive case is the broad non-superuser rather than the restricted one.'
