note: '**Two probe defects worth recording, because both produced confident wrong answers.**


  First, granting `django.contrib.auth.Permission` rows does nothing for Nautobot''s permission
  checks. `ObjectPermissionBackend.get_object_permissions()` reads the ObjectPermission model and
  nothing else, so a user granted 192 Django view permissions still saw a 1-tab menu and got a
  403 — identical to a user with six. The broad arm only became broad once granted through
  ObjectPermission. Anyone measuring permission cost in this codebase will hit this.


  Second, patching `type(user).has_perm` fails inside a request: the user is a SimpleLazyObject
  proxy with no `has_perm` on the class. `ObjectPermissionBackend.has_perm` is the only reliable
  funnel, and it has the advantage of counting checks however the user object is wrapped.


  The measurement was prompted by finding 51''s write-up flagging its own exposure, and it closes
  that gap rather than opening a new one. What it does not cover: a user whose ObjectPermissions
  carry *constraints*, which is the case where a check has to evaluate a queryset filter rather
  than a set membership. That is untested and is the remaining unknown in this area.'
