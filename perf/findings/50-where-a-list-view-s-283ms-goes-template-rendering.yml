note: 'The instrument is committed at 87643ff3b — three probes, harness only, nothing to
  adopt, which is why `commit` is null rather than naming it.


  **This resolves the contradiction in queue.md''s top candidate.** Two readings were on the
  record and disagreed: chrome ~274ms with list machinery ~83ms, or the reverse. On a quiet box
  chrome is 64–66ms measured twice independently, and the per-model term is ~218ms — the
  per-model reading, by 3.4x. The ~274ms chrome figure was contention inflation, taken with the
  suite running inside the nautobot container on the same cpuset as uwsgi. So the target is
  list-view machinery, not every page in the application.

  Two caveats carried deliberately. The 404''s view/render split is meaningless — error
  responses do not go through TemplateResponse, so it reports render=0.0 and view=wall; its
  per-template figures are still valid, which is how chrome reads as ~56ms of template work.
  And nothing establishes that only search.js reads the nav_menu script tag; one consumer was
  found, a second was not searched for properly.

  **No change is proposed here and nothing is ranked.** What the numbers support is that
  nav_menu.html is a fragment-caching target rather than an algorithmic one — a pure function of
  registry["nav_menu"] plus what the user may see, 15 tabs / 42 groups / 123 items, static per
  deploy. queue.md already carries *Fragment caching with a derived change stamp* as an unranked
  candidate, parked because the thing it was aimed at measured ~0.6ms and failed the stopping
  rule. The mechanism may have been shelved against the wrong target. The obstacle is is_active,
  which is per-request state inside both the HTML and the JSON.'
