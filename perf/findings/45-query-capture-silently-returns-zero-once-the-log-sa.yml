title: Query capture silently returns zero once the connection's query log saturates
site: perf/tier1_queries.py - perf/compare.py
summary: 'The stock arm of a 57-scenario Tier 1 run reported `query_count: 0` for its last six
  scenarios. Not failures: status 200, no error, a full response body, and a content hash
  byte-identical to the branch arm''s for the same URL. The branch arm measured those same six
  at the same positions correctly. `CaptureQueriesContext` records `len(connection.queries_log)`
  on entry and exit and slices between them, and that log is a `deque(maxlen=9000)` shared for
  the life of the process. Once it saturates the length stops growing, so every subsequent
  capture computes `final - initial = 0`.'
result:
  signature: 'six zero-query records, contiguous, at indices 51 to 56 of 57. Contiguity is
    what identifies the mechanism: a one-time connection recycle at CONN_MAX_AGE=300 would
    also reset the log and empty one slice, but the next scenario would re-baseline against
    the shorter log and measure correctly. A saturated deque is a permanent condition, so
    everything after it reads zero.'
  bias_direction: the arm that executes more queries saturates first, and that is always the
    baseline arm -- stock reached scenario 51 having executed roughly 7,647 queries against
    the branch arm's 5,472. So the failure under-reports the *before* side of every comparison
    and biases the result in the branch's favour.
  why_it_was_silent: 'status 200, a plausible 165KB body, and **`query_count_stable: True`**
    -- all three reps agreed on zero, so every stability check the harness owns passed it.
    It was caught only because the two arms disagreed in an impossible direction: six API
    endpoints appearing cheaper on stock than on the branch that optimized them.'
  committed_baselines_are_clean: all twelve committed baselines scanned for the signature
    -- status 200, non-empty body, zero queries -- and **zero records match**. The 38-scenario
    runs never accumulated enough to saturate; it took today's 57-scenario workload on the
    arm that executes the most queries. No published number is affected.
  threshold_not_pinned: stock executed ~7,647 queries before the first zero counting three
    requests per scenario, or 10,196 counting four. The limit is 9,000, so the exact crossing
    was not proven and the fix deliberately does not depend on it.
  graduated_not_binary: 'the trailing zeros are the visible tip. Re-running the same arm with
    the log cleared per capture shows the failure degrades progressively as the deque fills:
    api.interface.depth1 reported **495 queries against a true 1,067** -- understated by 572,
    46% of its value -- while still looking like an ordinary measurement, and only the six
    scenarios after it went fully to zero. Stock arm total 2,549 against a corrected 3,166,
    so **19.5% of the queries executed were never counted**. A run can therefore be materially
    wrong before it produces any record obviously impossible enough to notice.'
wall_clock: not applicable — this measures the instrument, not a change to Nautobot
basis: query capture returned zero for six scenarios that each issued queries
controls: 'the six were re-measured on the branch arm at the same positions and returned 6 to 11
