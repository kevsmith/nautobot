note: 'Three fixes, and only the first is the bug.


  **Clear the log before each capture.** A measurement should not depend on how much ran before
  it. This makes run length irrelevant and is correct whichever trigger applied, which matters
  because the arithmetic above does not pin the threshold.


  **Raise the per-connection limit from 9,000 to 18,000.** Defence in depth for the residual
  case the first fix does not cover: a single request exceeding the limit on its own. `bulk.delete.x100`
  already issues 2,222 queries, so 9,000 was about four times the largest operation measured
  here -- thinner headroom than a larger dataset or a new bulk operation deserves. Set on
  the connection inside the harness rather than in product settings, so the instrument''s
  configuration stays in the instrument.


  **Refuse an implausible record.** No authenticated Django page serves a 200 with a body
  in zero queries; there is a session lookup and a user fetch before the view runs. That combination
  is an instrument failure rather than a fast page, and it now fails loudly in `tier1_queries.py`
  and is refused by `compare.py`''s availability check. This is the fix that generalises:
  the first two close one hole each, and this one closes the class. The next variant of a
  silent-zero will announce itself instead of waiting for someone to notice that two arms
  disagree in an impossible direction.


  **The partial undercounts are the dangerous half.** A zero is at least absurd on its face,
  which is how this was caught. An endpoint reporting 495 of its 1,067 queries is not absurd
  at all -- it is a plausible number, stable across reps, on a status-200 response, and nothing
  in the harness or in a reader''s intuition would flag it. The plausibility guard catches
  the zeros; nothing catches a 46% undercount except clearing the log, which is why that fix
  is the one that matters rather than the guard.



  **The instrument passed its own stability check while reporting nothing.** That is the part
  worth remembering. `query_count_stable` compares reps against each other, so three reps
  agreeing on a wrong answer reads as confidence. A stability check cannot detect a systematic
  failure -- only a plausibility check can, and the harness had none until now.'
