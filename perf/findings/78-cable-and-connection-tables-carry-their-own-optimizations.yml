summary: 'These tables already had the optimizations they need — on the model, as
  `optimize_queryset_for_cable_columns` and the connection prefetch helpers — but applying them was
  the **view''s** job, so a table rendered anywhere else got none of it. The tables now apply their
  own, skipping what the view already prefetched. **Ported from Ken Celenza''s `7c3a785ee`,
  `375835e6b` and `bbe6061ee` (`Cabling | 2`, `3` and `4`)** on github.com/itdependsnetworks/nautobot.'
