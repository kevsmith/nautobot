note: '**The 18 remaining audit offenders, and why each is still one.** Three are the power and
  prefix utilization aggregates, which are per-row computations by design — the imported series left
  the same ones open, and its audit bottomed out at 8 for the same reason. Four are an artifact of
  the audit rather than a real cost: `PrefixTable` and `LocationTable` prefill their hierarchy values
  from `paginate()`, which the audit does not call, so it sees a cost the rendered page does not have
  — `/ipam/prefixes/` reads 17 queries flat at 100 rows. The rest are `connection` and `reachable`
  columns over `CablePath`.


  **A row-level cost is invisible to a column-level optimizer, and that is why this one survived
  everything before it.** `cable_status_color_css` runs from `row_attrs`, not from a column, so no
  amount of per-column declaration reaches it; finding 77 could only watch every column of the table
  report the same floor.'
