caveat: A configuration value written by another process is not picked up mid-request. Constance
  already has its own eventual propagation, and a config_updated receiver covers same-process
  writes.
note: 'B2 because max_depth uses the cross-request Redis cache. The invalidate_max_depth_cache
  receiver was extended to evict the request-local entry too, and that line is necessary --
  without it a tree change mid-request leaves a stale max_depth. Note the pre-existing hazard
  this shares: all six invalidate_*_cache receivers miss QuerySet.update() and .bulk_update(),
  which compile to one SQL statement and emit no signal.'
