reason: 'Not taken because there is nothing here a micro-optimisation could reach. 3,629 renders at
  ~7us is the cost of interpreting the template, and the only levers are **fewer nodes** or
  **fewer renders**.


  Fewer nodes means a smaller menu, which is a product decision rather than a performance one.


  Fewer renders means not rendering the menu per request, and there are two shapes for that, both
  out of scope for this branch as it stands. Caching the rendered HTML is risk B2 and awkward:
  the menu is permission-filtered, so the cache key is the user''s permission set, and finding 52
  measured a broad non-superuser seeing 15/42/122 against a superuser''s 15/42/123 — close but not
  equal. Rendering it client-side is more interesting, because **the data is already in the page
  twice**: `inc/javascript.html` emits the whole menu as JSON via `json_script` (12,841 bytes,
  logged separately in the queue), so the browser receives both a rendered HTML menu costing
  ~20.4ms of server time and a JSON copy of the same structure. That is an architectural
  observation, not an experiment this branch can run.'
note: '**The probe was broken and returned a confident zero.** It hooked
  `django.template.base.Node.render`, which dispatch never reaches: `NodeList.render` calls
  `render_annotated`, and every node type overrides `render` anyway. First run reported **zero
  renders against 160 compiled nodes** — the fifth instrument on this branch to fail that way
  rather than erroring. Fixed in the same commit by walking the subclass tree and patching every
  class that owns a `render_annotated`, `TextNode` included; it overrides the method as an
  optimisation and accounts for 1,854 of the 3,629 renders, so patching only the base class would
  have hidden the majority.


  **The probe''s own overhead is the reason its figures are usable.** `--validate` reports +17.1%,
  against probe_page_phases.py''s +1.6%. Its docstring predicted it would not be as cheap. Without
  that number the per-node costs would have been quoted ~17% high, and 9.8us versus 8.4us is the
  difference between "ordinary" and "ordinary" — but on a hotter template it could have been the
  difference between a hot spot and none.


  **This closes the nav_menu line of inquiry.** Findings 12, 50, 51, 52 and 57 have now taken it
  from ~47ms to ~20.4ms and established that the remainder is interpretation cost. Anything further
  requires not rendering it per request, which is a design change rather than an optimisation.'
