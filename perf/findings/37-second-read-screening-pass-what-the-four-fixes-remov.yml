note: 'The queue asked this pass to answer one question: does anything on the read side still
  outrank the write path for attention. It does not, and the ranking above is why.


  The four highest per-object costs sit on tables of 20 to 38 rows, where one page is the
  entire table. Fixing them would remove a few hundred queries from a request nobody has evidence
  anyone makes. Only two residuals sit on tables large enough for the cost to compound --
  dcim.cable?depth=1 (3,278 rows, 145 duplicates per page) and ipam.ipaddresstointerface?depth=1
  (2,937 rows, 130 duplicates) -- and both are the same per-row N+1 mechanism this branch
  has now fixed four times, with a known shape and a bounded payoff per endpoint. Against
  that, the write path has one measured 37% win at whole-workflow scale that nothing has attributed,
  and zero screening coverage. The queue order stands.


  Two things this run found that the ranking method itself would never surface.


  **dcim.device spends 438ms in the database over 8 queries with no duplicates.** Every read
  fix on this branch has been a query-count fix, and this endpoint has almost no queries to
  remove. It is the largest read-side db-time item measured and the instrument ranks it 100th.
  A screen that normalizes to queries per object is structurally blind to a slow query, and
  the fix for that is to rank on db time as well -- one line, since db_ms is already recorded.


  **The screen measures 166 endpoints and exercises 49.** 70 of them return zero rows against
  this dataset, so they contribute a measurement that says nothing while counting as coverage.
  This is the same failure the queue''s item 3 requires the write matrix to avoid, present
  in the instrument that raised the objection. Either seed the empty models or report attempted
  / exercised / measured separately, and stop quoting 166.


  On the regression. Finding 36 removed 472 queries from the depth=1 path and added 3 to the
  depth=0 path, which is a trade worth making at roughly 150:1 and was not visible in that
  experiment because the A/B measured depth=1 only. Making the prefetch conditional on depth
  is possible -- the viewset can read the requested depth -- but it is three fixed queries
  on an endpoint nobody has shown is hot at depth 0, so it is recorded rather than queued.


  **Correction, from re-reading the committed run while building the coverage accounting.**
  Three numbers above do not survive a check against `perf/baselines/screen-reads.json`. dcim.device''s
  list endpoint is **432.0 ms** over 8 queries with 0 duplicates, not 438. It is not the largest
  db-time item in that file: dcim.cabletocabletermination at depth 1 costs 574 ms and dcim.device
  at depth 1 costs 434 ms. And it ranks 334th of 518 records by queries per object, not 100th
  -- the earlier figure was taken from a differently-scoped list. The conclusion the paragraph
  draws is unaffected: a screen normalizing to queries per object cannot see an endpoint whose
  cost is a few expensive queries, and db_ms was already recorded, so the second ranking is
  one line. **"The screen measures 166 endpoints and exercises 49" needs its terms separated
  too.** Of 166 endpoints, 96 return at least one row, 49 return a full page of 10 or more,
  and 70 return none. 49 is the full-page count rather than the exercised count, and quoting
  it as coverage understates by 47 endpoints exactly as quoting 166 overstates by 70. The
  coverage block now reports all four numbers separately.'
