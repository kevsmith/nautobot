note: 'Two of these are worse per object than anything the inner loop has ever measured, and
  neither was in it.


  **dcim.cabletocabletermination at depth 1** is the largest: 19.5 queries per returned object
  with 473 duplicates on a page of 25. For comparison, api.interface.depth1 at its original
  worst was 1,229 queries for 100 objects -- 12.3 per object -- and that endpoint absorbed
  most of this branch''s effort.


  **dcim.interfaceconnections is a clean N+1: 9 fixed queries plus 14 per object.** Page-size
  sensitivity gives an exact linear fit -- 23 queries at limit 1, 79 at 5, 149 at 10, 359
  at 25, 709 at 50 -- so the cost is per-row work rather than pagination overhead. On 2,780
  rows that is the largest untouched N+1 the screen found.


  **Correction to an earlier reading of this record.** It said interfaceconnections showed
  ''a different cost class'' because its query count is identical at depth 0 and depth 1,
  and that none of the accepted fixes would touch it. Both halves were wrong. The endpoint
  simply ignores `depth`: diffing the two responses shows the only difference is the pagination
  `next` link echoing `depth=1`, exactly 8 bytes at every page size. Identical counts across
  depth therefore say nothing about cost class. It is the ordinary per-row N+1 class this
  branch has been fixing all along, which makes it more tractable rather than less. powerconnections
  and consoleconnections share the shape at 5.4 q/obj and presumably the same explanation.


  Caveats carried from the design. This weights every endpoint equally, which is a selection-free
  sample rather than a usage-weighted one -- nobody may list cabletocabletermination at depth
  1 in practice, and that is a product question rather than a measurement one. Per-object
  cost is misleading on pages of one or two objects, where fixed overhead dominates, so the
  ranking above is restricted to pages of ten or more. And dcim.connected-device returns 400
  without its required peer_device and peer_interface parameters, which is correct behaviour
  for a lookup endpoint rather than a failure.


  It is a screening instrument, not a regression gate. 518 measurements do not belong in the
  inner loop, which stays at 38 scenarios.'
