note: 'The generalization is Kevin''s and it is better than the one this record first carried.
  I described `_get_termination_attr` as code diverging from its docstring. It does not. The
  docstring says iterating `.all()` rather than `.filter()` means a prefetched cache IS HONORED
  IF ONE EXISTS -- it never claims one always exists. The method is written correctly and
  deliberately to be prefetch-friendly, and this fix works precisely because its authors wrote
  it that way.


  The actual pattern is an affordance added without its call sites being updated to use it, and
  this branch has already paid for the same thing once: finding 7 built a caching TemplateColumn
  and finding 11 existed only because just the device tables had been switched over to it.
  TERMINATION_PARENT_FK_FIELDS is a third instance waiting to be checked -- its own comment says
  it exists "to extend select_related so that rendering termination.parent ... stays query-free
  per row", which is an affordance with a stated purpose and an unaudited adoption list.


  That reframing is worth more than this fix, because it is predictive rather than descriptive.
  Screening endpoints by cost finds symptoms; screening affordances by adoption finds causes,
  over a far smaller search space than 166 endpoints. Proposed as an instrument, not yet built.


  Risk tier B1, no migration. The new state is prefetch caches on a queryset, which live and die
  with the request.'
