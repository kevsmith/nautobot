caveat: 'Flagged `third-party-coupled` on three distinct Django internals, and a Django major
  upgrade needs someone to re-check all of them: `sql.Query.is_empty()`; `NothingNode`''s
  AND-at-the-root semantics, which is what makes the predicate sound; and `_fetch_all`''s contract
  that assigning `_result_cache` and then deferring to `super()` still runs the prefetch step. The
  shipped tests compare against Django''s own implementation, so a semantics change fails a test
  rather than silently returning wrong rows — which is the failure mode that matters here, since
  this code sits under every query in the product.


  No API, UI, or export behaviour changes: executed queries are identical and the one
  digest-stable endpoint is byte-identical. But the blast radius is the widest of anything on this
  branch, and a reviewer should weigh the coupling above against a saving that is real but not
  enormous. If the coupling is judged unacceptable, the parked `MinimalModelChoiceIterator` change
  at 6594107e3 recovers roughly a fifth of the win (19 of a device list''s 99) in 29 lines of form
  code with no Django-internals dependency.'
note: '**Two claims made while investigating this were wrong and are corrected here.**


  First, that the general fix subsumed the parked `MinimalModelChoiceIterator` change. It does not.
  `ModelChoiceIterator.__iter__` calls `queryset.iterator()`, which bypasses `_result_cache` and so
  never reaches `_fetch_all` — that was 19 of the 20 compilations left after the first two guards
  landed, which is why the `iterator` guard exists. The parked change also covers something no
  guard here can: `ContentType` and `Group` use plain django `QuerySet`, so a
  `DynamicModelChoiceField` over either still compiles and discards per widget. Nautobot''s
  content-type-driven forms are not in the workload, so that cost is unmeasured rather than shown.


  Second, that the `compiled - executed` difference was probably innocent nested-subquery
  compilation. It is not: classifying by compiler nesting depth puts nested compilations at ~0 on
  every page measured. The first framing was right and the correction was wrong.


  **Each guard was added only after the previous residual was attributed**, not speculatively.
  `_fetch_all` and `exists` left 20 on the device list; attribution named `widgets.py:245` for 19 of
  them, which produced the `iterator` guard; the last one was the paginator''s `count()`. Four
  guards, four measured paths, and `as_sql total == executed` on every UI page afterwards.


  **The counter that made this visible has two limits**, now in its docstring: it counts only the
  base `SQLCompiler.as_sql`, so a query executed through a compiler subclass can make the
  `discarded` column read negative (`ui.ipaddress.list` shows −1); and a nested subquery compiles
  without executing, so the raw difference is not by itself proof of waste.'
