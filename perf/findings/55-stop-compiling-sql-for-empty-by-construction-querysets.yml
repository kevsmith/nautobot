title: Stop compiling SQL for querysets that are empty by construction
site: nautobot/core/models/querysets.py RestrictedQuerySet — nautobot/core/filters.py:760
summary: 'Django''s `ModelMultipleChoiceField.clean()` returns `self.queryset.none()` for every
  filter left blank. Both django-filter (`if not value`) and Nautobot''s
  `TreeNodeMultipleChoiceFilter.filter` (`value.exists()`) then truth-test it, and evaluating a
  queryset that is empty *by construction* compiles SQL in order to discover it is empty — 1033us
  for Device against 12us for the `query.is_empty()` check that can answer instead. Four guards on
  `RestrictedQuerySet` (`_fetch_all`, `exists`, `iterator`, `count`) answer without the database.
  A device list document request compiled 108 queries to execute 9.'
