tests: 'Full suite on a **fresh** database, because this sits under every query in the product:
  **Ran 17524 tests, OK (skipped=663, expected failures=1)** in 7774.6s, zero ERROR/FAIL blocks,
  exit 0 agreeing with the summary line. Against the 17,516-test baseline the +8 is this change''s
  six tests plus findings 53 and 54''s one each; skips and expected failures unchanged, so nothing
  stopped collecting.


  Six tests ship with it, comparing against Django''s own implementation rather than expected
  counts — asserting "no rows when is_empty()" would be circular, since the override under test
  produces that answer. 15 queryset shapes, including `filter(pk__in=[])` and `exclude(pk__in=[])`
  where the guards must decline, and three `union()` shapes because `as_sql()` does not apply the
  outer WHERE for combinator queries, making that the one place an outer `NothingNode` and a
  non-empty branch could in principle disagree.


  **The perf guard counts compiler invocations, not queries.** Its first version counted executed
  queries and was worthless: Django catches `EmptyResultSet` inside `execute_sql`, so the unguarded
  path executes nothing either, and the test passed with the guards removed. It now fails with them
  removed, reporting all four entry points reaching the compiler, and a negative control asserts a
  real queryset still does.'
