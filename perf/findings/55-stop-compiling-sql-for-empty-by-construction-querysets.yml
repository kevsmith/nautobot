  coverage_is_deliberately_partial: '`query.is_empty()` is **not** equivalent to what the old code
    effectively tested; it is a strictly narrower, sound subset. `set_empty()` installs a
    `NothingNode` ANDed at the root of the WHERE and `is_empty()` inspects only the root''s direct
    children, so true implies no rows. The converse fails: `filter(pk__in=[])` raises
    `EmptyResultSet` from the `In` lookup with no `NothingNode`, so the guards decline and it
    compiles as before. That is why `api.device.list` keeps 1 of its 79 and `ui.home` keeps its 2 —
    ~1.2ms across the whole workload, left alone on purpose.'
