wall_clock_detail: 'The fix is an instrument, not an edit to tier1w: perf/probe_f31_wall.py
  runs nine reps of each write operation and reports the median, min, max and per-rep timings,
  so one pause cannot move the answer. Observed round-to-round spread on that instrument is
  6-13% max-to-min within a round, and the round medians agree to about 2.6% across rounds --
  which is the noise floor finding 31''s controls independently reported.'
