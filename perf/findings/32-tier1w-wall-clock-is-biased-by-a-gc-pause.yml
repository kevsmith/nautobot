title: Tier 1W's wall clock is biased by a GC pause that three alternating rounds cannot cancel
site: perf/tier1w_writes.py - perf/probe_f31_wall.py
summary: tier1w_writes.py runs a warmup plus three reps of each operation and reports the wall
  clock of the LAST rep. A gen-2 cyclic garbage collection costs about 200ms in this process
  and recurs on a period set by allocation count -- which is deterministic for a given tree.
  So the pause lands on the reported rep for one arm and not the other, and it does so in every
  independent run of that arm. The arm-reversal rule cancels monotonic drift; it cannot cancel
  a bias that is not random.
result:
  incident: 'finding 31 read create.device at 89/89/89ms unpatched and 241/250/248ms patched,
    three rounds, both orderings -- a 179% regression that reproduced perfectly and was not
    real. The same operation measured over nine reps costs 83.7ms and 79.8ms. db_ms was flat
    at ~24ms in both arms, which is what said the cost was not in the database.'
  mechanism: '24 consecutive calls, gc counters read between each: 329ms on the cold first call,
    122ms typical, and one 323ms call carrying a gen-2 collection. Median 122ms, min 111ms,
    max 329ms.'
  exposure: '~200ms on operations tier1w reports between 25ms and 300ms, where it is up to 8x
    the true cost; ~6-7% on the ~3s bulk operations.'
