caveat: object_data is null for every record written after this lands. Both the REST serializer
  and the auto-generated GraphQL type use fields="__all__", so it surfaces as null in /api/extras/object-changes/
  and in the GraphQL objectData field. Separately, a change whose prior change predates object_data_v2
  -- Nautobot 1.2, migration 0022, which added the column with no backfill -- reports no prechange
  rather than comparing two v1 snapshots, because a v1 snapshot and a v2 snapshot are different
  shapes and cannot be diffed. With CHANGELOG_RETENTION at its 90-day default those records
  are long gone; where retention is 0 they persist.
note: '**Verdict as of 2026-09-06: do not implement.** The cost is unchanged -- two public API
  payload changes, a get_snapshots semantics change for pre-1.2 records, 13 test updates and a
  deprecation cycle -- and the benefit on the path that matters is now −2.1% of queries and a wall
  clock indistinguishable from zero. Finding 39 established that the write path should be judged
  on wall clock rather than query count; judged that way this change has nothing left to offer the
  REST API.


  Where it would still be worth something is pure-ORM bulk writes -- a Job, a data migration,
  nbshell -- where Tier 1W puts it at −7.7% queries and roughly −9% wall on a 100-object create
  loop. That is a real case and a narrow one, and it does not justify changing a public payload.


  **The general lesson is worth more than the verdict.** A recorded prize is a measurement of a
  tree that no longer exists. This one was taken before finding 31 landed, and finding 31 removed
  half of it -- so the branch competed with itself and the ledger did not notice. Anything parked
  for later should be re-measured before it is implemented, not just before it is proposed. The
  commit that first measured this said as much ("a recorded prize can go stale") and re-measured
  finding 16''s number before proceeding; the same discipline applied one step later would have
  caught this without a re-implementation.


  What the nullable route buys over 43db1b018, which wrote {} into the NOT NULL column,
  is not the 2 queries -- both save those. It is that {} makes the field present and lying:
  an empty dict is not "no data", so updating the 13 tests to match it would have encoded
  a falsehood. null is the correct JSON for "not recorded", so those same test updates become
  legitimate. A Tier C change whose tests can be honestly updated is a different proposition
  from one whose tests cannot.


  Two things established on the way that outlive this finding. Every object_data site turned
  out to be paired with an object_data_v2 site -- signals.py at 152/153, 391/392 and 488/489
  -- so the write path needed no other changes. And get_snapshots carried a latent AttributeError:
  its mixed-format branch dereferenced prior_change.object_data without checking prior_change
  is not None, reachable in principle for an UPDATE whose prior changelog was pruned on a
  record lacking v2. Unreachable today because every record has v1.'
