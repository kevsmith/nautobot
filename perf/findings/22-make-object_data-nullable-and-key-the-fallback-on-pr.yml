title: Stop writing ObjectChange.object_data, with the column made nullable
site: nautobot/extras/models/change_logging.py plus a new AlterField migration
summary: object_data holds the legacy v1 snapshot -- Django's serialize("json"), flat columns
  with foreign keys as bare primary keys. object_data_v2 holds what every current consumer
  reads. Both were written for every change record, so each write paid for two serializations.
  Migration 0146 makes the v1 column nullable -- AlterField, metadata-only, no table rewrite
  -- and to_objectchange stops populating it.
