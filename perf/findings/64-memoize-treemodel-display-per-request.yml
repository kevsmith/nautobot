note: '**Staleness is strictly tighter than what it replaces.** Nothing invalidates the display
  cache key anywhere in the tree; it expires on a 5-second TTL, and a request is normally far
  shorter than that. Outside a request scope — shell, management command, Celery worker — the read
  pattern is unchanged, which is the difference from the imported version: his memo is a
  process-lifetime TTL cache that a worker carries between tasks.


  **This closes `API | Caching` (PR 1 of the imported series) at 6 of 6.** The other five are
  recorded in `perf/ken-import.md`: two superseded by finding 1 and finding 4, one superseded by
  finding 6''s `cache_get_or_set` memo, and two declined because their process-wide caches are
  invalidated in-process only, so a sibling uwsgi worker keeps a stale value until it restarts.
  The whole PR aims at one shape — a value read once per serialized object — and findings 1, 4, 5
  and 6 had already closed that shape everywhere but this site.


  **The aggregate is not the point and the endpoint chosen is not arbitrary.** Only tree models
  reach this path, and only when their ancestry is not already in memory. On this dataset that is
  Location and LocationType; an instance with a deeper Location tree, or one whose tables carry
  more tree models, pays more of it.'
