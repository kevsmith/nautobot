title: Memoize TreeModel.display within the request scope
site: nautobot/core/models/tree_queries.py TreeModel.display
summary: '`TreeModel.display` read the cache backend directly, so it was the one read on this
  branch still costing a Redis round trip per rendered row. Nested serialization builds one object
  per row, so the in-memory ancestry walk finding 6 added cannot help: each row carries a separate
  LocationType instance with no parent loaded. Routing the read through `cache_get_or_set()` puts
  it in the `request_cache()` scope alongside every other cached read here.
  **Ported from the `TreeModel.display` third of Ken Celenza''s `fd584db6a` (`API | Caching | 6`)**
  on github.com/itdependsnetworks/nautobot, by this branch''s mechanism rather than his
  process-lifetime TTL cache.'
result:
  attribution: '`perf/scripts/probe_cache_gets.py` counts cache-backend GETs per key at 25 and 100
    rows across 16 endpoints. **Fifteen of the sixteen have no key that scales with row count at
    all.** The exception is `api.location.depth1`:
    `nautobot.dcim.locationtype.<uuid>.display` reads 22 at 25 rows and 97 at 100 —
    **1.000 GET per row**, the signature of a per-object read.'
  gate: 'the counter, not query count: 97 -> 5 per-row GETs (one per *distinct* LocationType on the
