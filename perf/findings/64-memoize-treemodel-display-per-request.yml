tests: '`nautobot.core.tests.test_tree_queries` 13 OK, including two new cases; and
  `nautobot.core.tests.test_tree_queries` + `nautobot.dcim.tests.test_models` +
  `nautobot.core.tests.test_models` 493 OK (skipped=12), serial. The new cases count backend GETs
  across three separately-loaded instances of one row: 1 inside a `request_cache()` scope, 3 outside
  it. Writing them corrected a wrong assumption — a *second read of the same instance* was already
  free before this change, because the recursion in the uncached path loads the parent chain into
  memory and the next read short-circuits on the in-memory walk. Only separate instances, which is
  what a rendered page actually has, reach the backend repeatedly.'
