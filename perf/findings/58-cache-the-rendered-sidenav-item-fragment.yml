  **A percentage alone would mislead here, which is why the absolute is in the headline.** A fixed
  17.7ms is −15.7% of a 124ms VLAN list and −5.2% of a 276ms device detail; quoting either number
  as "the" result overstates or understates depending on which page the reader has in mind.


  **The aggregate barely moves and that is expected.** Applying −17.7ms to the 28 chrome-bearing
  scenarios of the 57-scenario read loop is about −2.4% on the workload total, because 29 of the 57
  render no chrome at all. This is the shape of change that makes an application feel quicker
  everywhere without moving a benchmark total.'
note: '**Two defects were found and fixed before acceptance, both in the first cut, and the way the
  first one hid is the part worth recording.**


  The fragment was rendered with `render_to_string(template, {"nav_menu": ...})`. An explicit dict
  makes Django build a plain `Context` rather than a `RequestContext`, so no context processor runs
  and everything the template needs must be passed explicitly. The two favourites URLs were not,
  and Django resolves a missing variable to the empty string rather than raising — so all 123 items
  rendered `hx-post=""`, `data-add-url=""` and `data-delete-url=""`, and every star button posted to
  the current page instead of the favourites endpoint. Nothing failed. The page rendered, the markup
  was well-formed, and the only symptom was that every chrome-bearing response was **8,039 bytes
  smaller** — which was reported as an unpredicted benefit of the change across three rounds of
  measurement before it was traced. The arithmetic reconciles exactly: 122 items at −76 bytes
  (23 + 23 + 30, the three URL strings) plus one active item at −99, plus +1,332 for the new
  json_script and inline JS, equals −8,039. Only the 23 bytes on the active item were intended.


  The second: the cache key had no template component. `registry_fp` covers *which* items are
  registered, not *how* they render, and the backend is `django_redis.cache.RedisCache`, which
  outlives both the process and the deploy — confirmed by finding a `nav_menu_items:*` key alive
  after a container restart. An upgrade that edited the fragment without touching the registry
  would have served the previous release''s markup for up to NAV_MENU_CACHE_TTL, 24 hours. Fixed by
  adding a sha256 of the template source to the key. It was found while arranging cache flushing
  for the re-measurement, because the previous run''s defective fragments were sitting in Redis
  under keys the fixed code would have reused — the same failure an upgrade hits in production.


  **Correcting the record:** an earlier six-arm run of this change measured −19.0ms mean, against
  defect 1. Comparing that arm directly against the fixed arm shows the fix costs +0.1ms on the
  chrome scenarios, so the two results agree within noise — but −19.0ms measured broken markup, and
  −17.7ms is the figure for this commit. The earlier number should not be quoted.


  **What this does not fix:** the response is still ~393KB with ~269KB of menu markup. Caching
  removes CPU, not bytes, and gzip already handles the wire cost. Winning the payload back means
  rendering the menu client-side, which was considered and rejected here: apps currently contribute
  *markup* to the menu rather than data, so that path needs an app-extension contract first.
  `register_menu_items`'' own docstring agrees it is due a refactor — *"This is almost certainly
  overcomplicated and could do with significant refactoring at some point."*


  **Not attempted, deliberately:** removing the `HX-Current-URL` lookup in active-link resolution.
  The four real HTMX paths — list rows, embedded create/update, `component_id` component loads,
  embedded search — all render partials with no chrome, so the branch is currently unreachable. But
  an app could register an htmx view that renders full chrome, and `hx-get` appears in eight core
  templates, so removing it would convert a harmless defensive line into a latent bug.


  **Also observed and not fixed here:** `data-group-weight` renders empty on all 42 groups in
  *both* arms, so it is pre-existing and unrelated to this change.


  Supersedes nothing, but completes finding 57, which recorded the residual 20.4ms as having no hot
  spot and left the caching route open.'
caveat: '**The rendered navigation menu now outlives the request that produced it.** Finding 51''s
  docstring documents that its cache is request-scoped *specifically* so that "two users cannot
  observe each other''s menu"; this change gives that property up deliberately. It is restored by
  putting `user.pk` in the cache key — structural isolation rather than reliance on fingerprint
  exactness, because a subtle collision serving one user another user''s navigation is the failure
  mode least worth risking. `user.pk` is used rather than the username because usernames are
  mutable, so a rename would orphan an entry rather than invalidate it.


  Staleness is handled by recomputing the fingerprints on every request rather than by invalidation
  logic, so a permission grant or revocation produces a different key on the next page load and
  takes effect mid-session. Reviewers should confirm that behaviour specifically: it is the property
  most likely to be broken by a later "optimisation" that caches the fingerprint itself.


  Operationally: entries are stored in the Django cache (Redis in the standard stack) with a 24h
  TTL, one per (user, template, registry, permission set) at ~6.7KB gzipped, so memory scales with
  the number of *distinct permission sets* in use rather than with users or page views.
  `NAUTOBOT_NAV_MENU_CACHE_ENABLED` (default True) disables it without a deploy.


  Blast radius for review: every chrome-bearing UI page in the application. Two behaviours moved
  from server to client — the active-item highlight and the favourite-star state — so both are now
  applied by an inline script rather than present in the initial HTML. The active link is still
  resolved server-side and shipped as a string, because `_build_nav_menu` falls back to the current
  view''s related list URL, which is how a device *detail* page highlights the device *list* item; a
  client comparing `location.pathname` would lose that mapping. One semantic shift is accepted: the
  resolver tests against the *unfiltered* registry, so it can name an item the user cannot see, in
  which case the client''s selector matches nothing and no class is applied — identical to today,
  where the item is not rendered at all.'
