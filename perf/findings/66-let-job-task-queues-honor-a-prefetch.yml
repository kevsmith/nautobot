note: '**The property still returns a list**, as it did on this branch before the change —
  `list(values_list(...))` became a list comprehension — so no caller sees a different type. The
  upstream version returned the `ValuesListQuerySet` itself; that difference predates this change.


  **Ordering is untested by this dataset.** All 16 Jobs have exactly one queue (`default`), so a
  page cannot show whether `values_list()` and a prefetched `all()` order multiple queues the same
  way. Both go through `JobQueue`''s default ordering, which is why this is recorded as a gap in the
  evidence rather than a risk in the change.


