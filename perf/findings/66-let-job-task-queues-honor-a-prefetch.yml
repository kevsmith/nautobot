title: Let Job.task_queues honor a prefetch, and prefetch it on the Job viewsets
site: nautobot/extras/models/jobs.py Job.task_queues - nautobot/extras/api/views.py JobViewSetBase
summary: 'The deprecated `task_queues` property read `job_queues.values_list("name", flat=True)`,
  which issues its own query every time and so cannot see a prefetched result. The REST API
  serializes that property for every Job in a list response, and `exclude_m2m` hides `job_queues`
  from the automatic prefetch, so nothing upstream could help either. Reading `job_queues.all()`
  honors a prefetch, and the viewset now asks for one. **Ported from the Job half of Ken Celenza''s
  `c4dfe22a8` (`API | Targeted | 3`)** on github.com/itdependsnetworks/nautobot.'
result:
  attribution: '`perf/scripts/probe_query_slope.py`, queries at 4 and 16 rows (16 Jobs exist):
    `/api/extras/jobs/` 11/23 -> 8/8, `/api/extras/jobs/?depth=1` 10/22 -> 7/7. **Exactly 1.000
    query per row before, 0.000 after.**'
  flat_in_row_count: '8 queries at 4 rows and 8 at 16 — the count stops growing with the page,
    which is the grouped-prefetch signature rather than merely a smaller number.'
  wall_clock: '`/api/extras/jobs/` at 16 rows, three alternating rounds of 9 reps on a quiesced
    host: **84.2 -> 67.9 ms median, −16.3ms, −19.4%**. The arms do not overlap — stock
    88.7/80.6/84.2 against branch 68.3/67.6/67.9.'
controls: '`/api/dcim/locations/` was measured in the same reps as a control that cannot benefit:
