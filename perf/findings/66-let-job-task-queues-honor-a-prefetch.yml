  **The body digest is not usable on this endpoint and that is worth knowing before anyone
  re-runs it.** It differed on every round *on both arms*: Nautobot re-registers its Jobs at
  startup and rewrites `extras_job.last_updated` (measured at 8 seconds after container start), and
  every arm swap restarts the container. The payload control is instead
  `perf/scripts/probe_jobs_equivalence.py`, which dumps `{job name: task_queues}` and returns
  **byte-identical output on both arms** for all 16 Jobs.'
