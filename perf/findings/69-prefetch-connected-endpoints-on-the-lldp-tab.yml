note: '**This page had never been measured here.** It is not in `perf/workload.yml`, so neither the
  read loop nor the read screen — which is REST-only — has ever touched it. A 1.3-second page sat
  outside every instrument on the branch. `perf/queue.md` already carries "screen the UI surface" as
  an open item; this is the second piece of evidence for it, after finding 44 found that all 20
  `ui.*.list` scenarios were measuring shells.


  **It is one device''s page, and the cost scales with cabling rather than with interfaces.** A
  device whose interfaces are mostly uncabled has less to save; this dataset cables enough of them
  to make this the slowest single view measured on the branch.'
