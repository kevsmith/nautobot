summary: 'The LLDP tab renders each interface''s connected endpoint and that endpoint''s device, to
  compare against what LLDP reports. The queryset was optimized for the cable columns but not for
  the connection column, so the page walked the cable path once per row. **Ported from Ken
  Celenza''s `5082f4a10` (`UI | Views | 1`)** on github.com/itdependsnetworks/nautobot.'
