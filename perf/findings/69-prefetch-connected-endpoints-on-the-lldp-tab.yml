    largest single-page reduction recorded on the branch.'
controls: '`/api/extras/job-queues/` is flat and overlapping across arms (34.7–34.9 against
  34.6–34.9). **The second control is less clean and is reported as measured**: the device *detail*
  page reads 208.2/220.7/232.8 on stock against 208.0/207.5/207.0 on branch — the stock arm drifts
  upward across rounds while the branch arm is steady, and the ranges touch rather than overlap
  (208.2 against 208.0). Nothing in this change is reachable from the detail page, which renders no
  LLDP tab, so the reading is that the stock arm drifted; recorded rather than smoothed, because a
  control that moves is a fact about the measurement.


  **Payload equivalence needed its own instrument.** A UI page carries a per-request CSRF token
  twice — once as a form input and once in the `hx-headers` attribute on `<body>` — so the response
  digest differs between two renders on the *same* arm. `perf/scripts/probe_lldp_equivalence.py`
  strips both and digests what is left. Stripped renders are identical within each arm, and the two
  arms'' pages differ by **exactly one line: a rendered clock** (`23:10` against `23:12`, the arms
  having been measured two minutes apart).'
