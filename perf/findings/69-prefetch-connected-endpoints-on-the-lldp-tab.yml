  attribution: '`perf/scripts/probe_ui_views_nplus1.py` on the device with the most interfaces
    (`SEA01-01-access-27`, 49 interfaces): **875 queries, 17.857 per interface**. Two shapes are 484
    of them — 334 SELECTs on `dcim_interface` and 150 on `dcim_device`, the peer interface and its
    parent device, once per row. After: **34 queries, 0.694 per interface.**'
  flat_in_row_count: 'three devices of different sizes after the change: 49 interfaces -> 34
    queries, 33 -> 38, 14 -> 31. **The count no longer tracks the interface count at all** — 33
    interfaces costs more than 49 — because what remains is per-content-type prefetch groups rather
    than per-row reads.'
  wall_clock: 'three alternating rounds of 9 reps on a quiesced host: **1,320.7 -> 246.4 ms,
