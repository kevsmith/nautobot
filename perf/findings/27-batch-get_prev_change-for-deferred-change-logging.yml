note: 'Upstream issue #6303 remains open and the TODO in context_managers.py:273 is accurate
  about the mechanism -- one query per object change. What this record adds is the size of
  the prize, so nobody spends the effort twice to find out.


  Worth revisiting if the write path ever becomes latency-critical, or if the ObjectChange
