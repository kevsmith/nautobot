  number is a larger share.'
reason: Measured at a 3.1% ceiling on bulk.update and 2.7% on bulk.delete, against an implementation
  that has to handle an object changed twice within one request (the flush loop iterates oldest-first,
  so the second change's prior change is the first) and cannot use the clean DISTINCT ON form,
  which is PostgreSQL-only in Django while the loop above it carries a comment about MySQL
  sort behaviour. Not worth that for 3%.
