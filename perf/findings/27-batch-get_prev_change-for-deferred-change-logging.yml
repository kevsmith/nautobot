title: Batch get_prev_change for deferred change logging
site: nautobot/extras/context_managers.py:275 - nautobot/extras/models/change_logging.py:202
summary: 'get_snapshots() calls get_prev_change(), one SELECT per ObjectChange, and the deferred
  flush loop calls it once per record. It only fires for non-CREATE actions, which matches
  the measurements exactly: bulk.create pays nothing while bulk.update.deferred (1,472 queries,
  49 changes) and bulk.delete (2,019 queries, 50 changes) both do. The code already carries
  a TODO saying so, and it is upstream issue #6303.'
result:
  measured_prize: 49 get_prev_change calls costing 101.3ms of a 3278.7ms bulk.update.x100.deferred
    (3.1%); 50 calls costing 96.9ms of 3535.0ms on bulk.delete.x100 (2.7%); 0 calls on bulk.create.deferred,
    since it only fires for non-CREATE actions; 2 calls costing 4.1ms on delete.device (0.9%)
wall_clock: −3.1% ceiling, bulk update
wall_clock_detail: 'The prize was measured before the fix was attempted, by wrapping get_prev_change
  to count and time its calls while running the same operations Tier 1W runs. Batching cannot
  recover all of it -- the batch is still one query -- so the realistic saving is ~3.0% of
  a bulk update or delete.


  This also corrects how the target was described. get_snapshots() was called the largest
  remaining SQL item on the write path, which is true by query count -- 100 queries per 100-object
  operation -- and false by time. Query count misranking a target, again: the same lesson
  as the rejected FK pre-warming, arrived at from the other direction.'
