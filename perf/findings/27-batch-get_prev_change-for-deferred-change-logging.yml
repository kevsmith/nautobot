note: 'Recorded rather than attempted, because the one-line description hides two things that
  make it a careful change rather than a quick one.


  First, intra-request repeats. The flush loop iterates order_by(time) oldest-first, so when
  an object changes twice within one request the second change''s prior change is the first.
  A naive batch pre-fetch gets that wrong. The shape that works is to pre-fetch the newest
  pre-request change per object and then update the map as the loop advances.


  Second, portability. The clean batch form is DISTINCT ON (changed_object_type, changed_object_id),
  which is PostgreSQL-only in Django. The loop immediately above carries a comment about avoiding
  a MySQL sort exception, so MySQL is a live concern and a portable reduction in Python may
  be needed instead.'
