title: Arming to a third ref leaves files behind, and the same ref then hashes two ways
site: perf/scripts/arm_control.sh
summary: '`arm_control.sh arm <ref>` swaps `nautobot/` with `git checkout <ref> -- nautobot/`,
  which overwrites but never deletes, and then removes the difference by hand. The removal
  set was `git diff --name-only --diff-filter=A <ref> HEAD -- nautobot/`: the files HEAD adds
  relative to the target. That is correct while exactly two refs are in play and HEAD is one
  of them, and it is wrong the moment a third appears. A file carried in by an earlier arm to
  some other ref is absent from both `<ref>` and HEAD, so it is outside the removal set, and
  the path-scoped checkout cannot clear it either. It survives into the next arm.'
result:
  observed: 'arming `upstream/next` -> `perf/experiments` -> `upstream/next` produced content
    hash `74f4a39e7dfc3fbc` on the first arm and `b98181229fdead80` on the third, for the same
    ref. The intervening arm restored 40 `tests/integration/*.py` modules that `perf/experiments`
    still carries and that upstream deleted between `ce01a0464` and `c3605ae48`, migrating the
    Selenium suite to Playwright (47 such files to 7). Neither `upstream/next` nor HEAD
    (`perf/experiments-next`) has them, so nothing removed them.'
  detection: 'the hash was recorded on the first arm and compared against the third. Without
    that comparison the run would have completed normally: `git diff <ref> -- nautobot/` reports
    the *tracked* tree as identical, because the leftovers are untracked relative to HEAD. The
    tell is `git status --porcelain nautobot/` showing `??` entries, which no gate looked at.'
  measurement_impact: 'the 40 files are test modules under `tests/integration/`, imported by
    no runtime path, so neither query count nor wall clock is expected to move -- and that is a
    statement about these particular files rather than about the defect. `nb_hash` walks every
    `*.py` under `nautobot/`, so the leftovers changed the hash without changing the program.
    The next leftover need not be inert; the same sequence would carry a stale module that
    *is* imported just as readily.'
  committed_baselines: 'every published A/B on this branch alternates two refs with HEAD as
    one of them, which is the case the old removal set handles correctly, so no committed
    baseline is expected to be affected. This was reasoned from the arming pattern rather than
    re-measured, and the perf/exp-* branches were not audited individually.'
wall_clock: "not applicable: this measures the instrument rather than a change to Nautobot"
basis: the same ref armed twice produced two different content hashes
controls: 'arming each ref twice in alternation after the fix -- `upstream/next`,
  `perf/experiments-next`, `upstream/next`, `perf/experiments-next` -- reproduces
  `74f4a39e7dfc3fbc` and `368a99a0401538e6` exactly, with zero tracked difference and zero
  untracked files under `nautobot/` on every pass. The two arms differ from each other, which
  is the property the protocol actually rests on.'
