note: 'The removal set is now computed against the **working tree** rather than against HEAD:
  every file under `nautobot/` that the target ref does not have is removed, whatever put it
  there. `project-static` is excluded because it is build output `nb_hash` already ignores, and
  `__pycache__` because discarding it would hand the next run a cold import.


  This is the second time this script has been wrong in the same direction, and the first fix
  is why the second was possible. Its header already records finding 22''s migration surviving
  into the stock arm, and the repair for that reached exactly as far as the incident did --
  two refs, HEAD one of them. A fix shaped to the incident rather than to the mechanism leaves
  the mechanism live, and the second occurrence cost a restarted measurement run rather than a
  wrong number only because the hash happened to be compared.


  **A content hash proves two arms differ. It does not prove either one is what it claims to
  be.** The protocol has always read the hash as evidence the swap happened, and it is good
  evidence for that. Here both arms were distinct and one of them was not the ref it was
  labelled with. The check that would have caught it costs nothing and is now worth running
  beside the hash: `git status --porcelain nautobot/` must be empty.


  **`git diff <ref> -- nautobot/` is not that check, and it reads backwards.** It compares
  `<ref>` against the *index*, and `arm` ends with `git reset -q`, so the index is HEAD. Arming
  to any ref that is not an ancestor of HEAD then reports every file the ref has and HEAD lacks
  as `D`, deleted, while those files sit on disk correctly restored -- arming to
  `perf/experiments` from a `perf/experiments-next` checkout shows 45 phantom deletions. The
  file-set comparison is the honest one: 1,205 `*.py` in the worktree against 1,205 in the ref,
  at the hash the ref is known to produce. An earlier empty `git diff` here looked like
  verification and was only an accident of `upstream/next` being an ancestor of HEAD.'
