note: '**Correcting the record on finding 31.** Its `wall_clock` reads "−6.9% bulk.create.x100.loop,
  −5.6% deferred", measured on 2026-09-05 against a tree that still called `serialize_object` from
  `to_objectchange`. Finding 22 landed afterwards and removed that call. The figure was true when
  written and describes a code path the branch no longer takes; the saving it names is now
  delivered by finding 22. Finding 31''s record is not wrong, it is superseded, and the two must
  not be added together when totalling the branch''s effect.


  **How this was found, which is the part worth generalising.** The tagged dataset was built to
  exercise finding 31''s untested path — the branch where `_tags` is truthy. Looking for where
  that path runs is what surfaced the fact that it does not run at all. A fix whose measured
  benefit survives while its mechanism is bypassed is invisible to every instrument this branch
  owns: query counts still fall, wall clock still improves, and the attribution is simply wrong.
  Only counting the calls showed it.


  **Two of this branch''s own findings overlapped and nobody noticed for six days.** Finding 31
  landed 2026-09-05 and finding 22 on 2026-09-06. Each was measured against the tree that preceded
  it, which is correct procedure and still insufficient: neither experiment could see that the
  later one would strand the earlier. The cumulative table is unaffected — it measures the whole
  tree against stock and does not sum per-finding figures — but the per-finding column in
  `perf/report.md` now carries two rows that describe the same saving.


  **What follows from this is a subtraction, and it is the useful part.** Finding 31 is the
  branch''s riskiest tier — C, changing observable behaviour, with a documented trap where fixing
  the presence check alone would have made every REST PATCH that leaves tags alone log the object
  as untagged. If its mechanism is inert, the branch can shed a tier C change and a per-batch query
  for nothing. Priced separately.'
