summary: 'Finding 31 fixed `serialize_object`''s `_tags` cache, where `getattr(obj, "_tags", []) or
  obj.tags.only("name")` fell through for an object whose cached list was empty. Finding 22 then
  stopped writing `ObjectChange.object_data`, which **removed the `serialize_object` call from
  `to_objectchange` entirely**, leaving `serialize_object_v2` — which does not read `_tags`. The
  `_tags` attribute has exactly two writers and one reader in the whole codebase, and on this
  branch the reader is no longer called from the change-logging path. Finding 31''s mechanism is
  therefore inert on the branch, and its `tag_cache_warmed` warmer issues one `TaggedItem` query
  per batch whose result nobody reads.'
