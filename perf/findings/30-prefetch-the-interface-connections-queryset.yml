  \nThe first two are prescribed by the code itself. `.cable`'s docstring reads: 'Issues up\
  \ to two queries on first access (one for the join-table row, one for the cable). Use select_related(\"\
  cable_termination__cable\") on the parent queryset to avoid the queries.' Nothing does.\n\
  \n**Finding 26's depth guard prevents its own fix from reaching here, and that is the interesting\
  \ part.** Sites 5 and 6 -- _first_cable_path and _destination -- are exactly the two that\
  \ finding 26 collapsed for api.interface.depth1, 100 of the 350 queries. But _warm_peer_cable_paths\
  \ is gated on `depth > 0`, and this endpoint ignores depth entirely, so the warm never runs.\
  \ The guard was measured and correct for api.interface.list, where it saves 56ms; it is\
  \ wrong here, where it withholds a fix that would apply. The guard should key on whether\
  \ peers will actually be serialized rather than on the depth parameter.\n\nNot attempted\
  \ yet because the prefetch paths have to be expressed from CablePath rather than from Interface\
  \ -- the serializer adapts a CablePath row into the interface_a / interface_b shape this\
  \ endpoint has historically exposed -- so it is a larger change than the one-line joins\
  \ that fixed findings 25 and 26, and it wants its own session.\n\npowerconnections and consoleconnections\
  \ read 5.4 q/obj and are almost certainly the same viewset shape, so one fix plausibly covers\
  \ three endpoints."
