title: Prefetch both ends of an interface connection, which the serializer renders in full
site: nautobot/dcim/api/views.py InterfaceConnectionViewSet - nautobot/dcim/models/cables.py CablePath.interface_connections
summary: 'The largest untouched N+1 the read screening pass found: 9 fixed queries plus 14 per
  returned object, exactly linear against page size, on a 2,780-row endpoint. InterfaceConnectionSerializer
  embeds a full InterfaceSerializer for both ends of every connection, so each per-interface
  lookup is paid twice per row. CablePath.interface_connections() now takes an optional endpoint
  queryset, and the API viewset passes one carrying the prefetches its serializer actually reads;
  the UI list view, which renders two columns rather than two whole interfaces, keeps the lighter
  default.'
