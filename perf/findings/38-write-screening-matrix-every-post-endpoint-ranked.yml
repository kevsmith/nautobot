title: The write screening matrix — every POST endpoint, ranked on cost per created object
site: perf/screen_writes.py - perf/payloads.py
summary: 'The read screen''s counterpart, built to the same rules: enumerate from the URL
  resolver at run time, normalize to cost per object, and never let an unmeasured model read
  as a cheap one. 152 of the resolver''s 166 API list endpoints accept POST; 105 were measured
  across create.x1, create.x10 and update.x1, for 257 measurements in 211 seconds. The
  headline is the comparison it makes possible: the *median* marginal cost of creating one
  object is 12 queries, against a median read cost of 0.28 queries per returned object, and
  the cheapest create on the entire surface (3.0) is more expensive per object than 47 of the
  49 read endpoints that return a full page.'
