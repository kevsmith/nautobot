controls: 'Rollback isolation was measured against the alternative rather than assumed from
  finding 29. Both modes were run over the five measured dcim.device* models, three rounds each
  way with the arms alternated (rb, rs, rb, rs, rs, rb), 13 operations compared on medians.


  **Query counts differ by exactly -2 on all 13 operations, in every round.** That is the
  SAVEPOINT/RELEASE pair the outer transaction adds and nothing else -- the same 2-query
  difference finding 29 measured on bulk create at a completely different scale. The write
  path itself does not change shape when the transaction commits.


  **Wall clock: the committed arm is +3.0% median (range -2.2% to +11.4%).** That is an upper
  bound on what rollback under-reports, not an estimate of it, because the reset arm carries
  the residual cold-buffer cost of the clone that precedes it. Finding 29 measured -0.9% on
  bulk create with a restore before every arm; this is the same answer at the same order of
  magnitude.


  Rollback is available at all only because the requests go through the Django test client and
  stay in-process. Finding 29''s "REST writes cross the process boundary" is true of a real
  HTTP client against uwsgi and not of this one.


  **Change logging is not hidden by the rollback**, and this was checked rather than inherited:
  Nautobot records ObjectChanges from synchronous post_save receivers, ObjectChangeMiddleware
  flushes them inside the same request, and there is no transaction.on_commit anywhere on that
  path. What rollback does omit is the five on_commit callbacks elsewhere in Nautobot,
  including custom-field job enqueueing at extras/customfields.py:744.


  **--isolation reset needed three corrections before it was a control rather than a trap**,
  and each is a way a write screen can produce confident wrong numbers. It cannot shell out to
  perf/reset_db.sh, because this runs inside the container and that script drives docker
  compose from the host -- so the clone is issued over a second psycopg2 connection, carrying a
  reimplementation of the migration fingerprint that --verify-reset checks against the shell
  one (they agree byte for byte). force_login writes a django_session row, so the client has to
  be logged in again after every clone or every subsequent request is anonymous. And the
  post-clone throwaway request has to be rolled back even in reset mode: a committed throwaway
  collides with the measured request on every unique name, which reads as a rejected payload.'
