note: '**The instrument was blind before this experiment, and that is the more transferable
  result.** `probe_url_reversals.py` patched `django.urls.reverse` only. `from django.urls import
  reverse` binds the function object into the importing module at import time, so the patch was
  invisible to `rest_framework.reverse` — which is the whole of the REST API''s reversing. The probe
  reported **zero reversals** for `/api/dcim/devices/?limit=100`, a 332ms endpoint, and zero reads
  as "nothing to find here" rather than as "this instrument cannot see". It now rebinds every alias
  in `sys.modules`. Finding 45 recorded the same class of failure for query capture; this is the
  second instrument on the branch that returned a confident zero.


  **A route that cannot take a UUID falls back permanently.** `ContentType` and `Group` have
  integer pks, so the sentinel raises `NoReverseMatch`, the memo stores `None`, and every object of
  that type takes DRF''s own implementation — one reverse per object, exactly as before.'
