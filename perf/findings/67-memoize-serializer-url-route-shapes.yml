title: Memoize the route shape of serializer URLs, so reverse() runs once per route
site: nautobot/core/api/fields.py HyperlinkedURLMemoMixin - nautobot/core/api/serializers.py
summary: 'Every serializer emits a `url` field and one hyperlink per related object, and each called
  `reverse()` for every object in the page — the same route every time, differing only in the pk.
  `HyperlinkedURLMemoMixin` resolves the route once with a sentinel UUID, splits the URL around it,
  and substitutes the real pk afterwards; the memo lives on the DRF field instance, which is created
  per serializer instantiation and reused for every object under `many=True`. The same pattern
  covers `notes_url`, the last per-object `reverse()` in the serializer. **Ported from Ken
  Celenza''s `68920cacc` (`API | Behavioral | 1`)** on github.com/itdependsnetworks/nautobot.'
