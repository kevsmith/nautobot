wall_clock: "−54.2% relationshipassociation, −26.7% objectchange list; −4.8% queries across the read screen"
wall_clock_detail: 'Per-endpoint figures are the headline because the aggregate is governed by how
  many GFK-bearing models the dataset populates rather than by the change. Measured in-process on
  the read screen; **no Tier 2 figure exists and that is deliberate** — three of the four affected
  models have no scenario in the 57-scenario read loop, so Tier 2 is blind to this change. A Tier 2
  leg was launched and killed once that was checked, which is what prompted the instrument-selection
  rule now in `perf/README.md`.'
note: '**The aggregate understates the change, and the cause is dataset coverage rather than
  reach.** Ten of the eighteen GFK-bearing models hold zero rows here — `Note`,
  `StaticGroupAssociation`, `ImageAttachment`, `ApprovalWorkflow` among them — so only four models
  could contribute and all four did. `perf/dataset-gaps.md` is the standing record of that limit.
  A reader should not infer that a −4.8% aggregate bounds what this is worth on a populated
  instance.


  **It does not subsume finding 56**, which hand-prefetched the same `changed_object` GFK on the
  home page changelog panel. That panel is built in `extras/homepage.py` and never passes through
  `ModelViewSetMixin`, so the two live in different code paths and both stand. Checked
  structurally rather than measured, and recorded that way — after findings 60 and 61, where an
  assumed overlap turned out to be real and an assumed mechanism turned out not to be.


  **On the gate''s verdict line.** `run_experiment.sh` reports 2,235 -> 705 queries (−68.5%)
  against the stock baseline and exits FAIL on eight regressions. All eight are finding 62''s
  documented depth-0 trade. The baseline is stock by design, so a FAIL is now the permanent state
  of this branch and the usable signal is whether the regression *set* changed. It did not. Anyone
  reading the exit status alone from here on will draw the wrong conclusion.'
