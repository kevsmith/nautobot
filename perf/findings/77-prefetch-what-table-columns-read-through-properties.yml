title: Prefetch what table columns read through properties and templates
site: nautobot/dcim/tables - nautobot/extras/tables.py - nautobot/ipam - nautobot/virtualization
summary: 'One defect in many places: a column whose value comes from a property, a template or a
  linkify callback reads relations the accessor walk cannot name, so `BaseTable`''s automatic
  optimization derives nothing and the read happens once per row. Fixed by declaration —
  conditional prefetches, `display_prefetch_related` (finding 74''s convention), and three reads
  made to honor a prefetch that was already there. **Ported from Ken Celenza''s `9c6431d23`,
  `4eab9c8d0`, `c5d3cd136`, `ba5cbadaa`, `fd0aa7b4e`, `b28f73e43`, `cafdbbe7f` and `f2d45ff6b`
  (`UI | Tables | 2` and `4`-`10`)** on github.com/itdependsnetworks/nautobot.'
