note: '**The remaining 54 offenders have one cause and it is not a column.** Every `InterfaceTable`
  and `DeviceModuleInterfaceTable` column reads 1.750 q/row, including `mtu` and `description`,
  because `row_attrs` calls `cable_status_color_css(record)`, which reads `record.cable` for every
  row whatever columns are visible. A row-level cost is invisible to any column-based optimization,
  and it is what `Cabling | 2` in the same series addresses — so it is deliberately not fixed here.


  **Six declarations are carried unmeasured**, because their models hold too few rows on this
  dataset to show a slope: `ObjectMetadata`, `ScheduledJob`, `DynamicGroup` memberships,
  `SoftwareVersion`, `LoadBalancerPoolMember` and `VRFDeviceAssignment`. They are taken on the
  strength of reading what their `display` and render methods touch, and this is where that is
  recorded rather than implied.


  **One of the fixes is a deferred-field trap rather than a missing prefetch.**
  `Job.latest_result` used `.only("status")` as a deliberate optimization for the job list; the Last
  Run column then rendered `date_created` and `user`, so each row loaded two deferred fields and
  fetched a user. Removing the `.only()` and prefetching the slice is faster than the optimization
  it replaces.'
