caveat: 'The count and the query are established; **why a device list builds that button twice is
  not**. `build_trigger_context` resolves the Job per call and nothing memoises it, so two calls
  means two queries -- but what makes the device list call it twice where a VLAN list calls it
  once was read from the source, not measured.


  Scope is the 57-scenario read loop. Whether the added query reaches list views outside that set
  is untested, though a button on the shared list template suggests it reaches all of them.


  No wall-clock figure. One indexed single-row lookup is small next to a list render; the claim
  here is about query counts only.


  **This finding''s first draft blamed `ExportTemplate` and was wrong.** That came from reading
  Tier 1''s `distinct_shapes` count -- which says a shape was added, not which -- and pairing it
  with a plausible-looking new line in the diff. The `ExportTemplate` query had been there all
  along. Capturing shapes on the old ref is what settled it, and nothing short of that could
  have.'
note: '**Worth reporting upstream rather than absorbing.** The duplicate is the class of defect
  this branch spent 87 findings removing -- read-loop duplicate queries went 2,792 -> 66 -- and
  #9501 adds one back on the most-trafficked page in the product. An uncached per-button Job
  lookup is cheap to fix at the source (memoise per request, as findings 4 and 5 did for natural
  keys) and awkward to fix downstream.


  **It also sets a floor no branch finding can reach.** These 22 queries are in both arms, so they
  are carried into every cumulative figure this re-measure produces. A reader comparing the new
  report against the old will see the read-loop percentage move with no branch commit having
  changed, and this finding is the explanation.


  **Finding 89 returns 4 of these 22 queries, and cannot return the rest.** Memoizing the Job
  lookup for the duration of the request collapses the device lists'' doubled call to one. The
  other 18 are a single lookup per list view with nothing to collapse them against, so they stay
  until either upstream caches the lookup or the trigger stops resolving its Job at render time.


  **Separately, the shape normaliser has a gap worth fixing.** `normalize_sql` replaces `\b\d+\b`,
  which does not match digits inside an identifier, so a server-side cursor name
  (`_django_curs_136085289079680_sync_80`) survives normalisation and makes the same query a
  different "shape" in every process. It showed up here as a phantom `extras_objectchange`
  shape appearing and disappearing between arms. It inflates `distinct_shapes` across runs and
  should be stripped; it does not affect query counts, so no published figure depends on it.'
