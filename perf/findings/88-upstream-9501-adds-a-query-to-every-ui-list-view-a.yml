title: 'Upstream #9501 adds a Job lookup to every UI list view, and runs it twice on device
  lists'
site: nautobot/core/ui/object_detail.py:3042 (`Job.objects.get_for_class_path`) and :3096
  (`ExportObjectListModalButton`), upstream `next`; measured with perf/scripts/probe_exportbtn.py
summary: 'Re-measuring the read loop against the new base turned up 22 queries this branch did
  not put there. `next` moved from c3605ae48 to 3f77053a7 while the branch was rebased, and the
  Export Objects rework added **one query to every UI list view and a second one to the four
  device lists**.


  The query is `Job.objects.get_for_class_path("nautobot.core.jobs.ExportObjectList")`, issued
  from `_JobModalButton.build_trigger_context` when the export button renders. It is uncached,
  so it runs once per button built -- and on device lists it runs **twice with a byte-identical
  WHERE clause**, fetching the same Job row twice in one render.


  This is an upstream regression, not a branch effect: both arms carry it identically, and the
  branch removes neither.'
