note: '**The prediction was wrong in the branch''s favour, and it was recorded before measuring.**
  The scratch-branch commit says "nothing moves". The result is −2 queries — `tag_cache_warmed`
  firing on the two deferred paths with nobody reading it. Dropping finding 31 is marginally
  better than neutral rather than free.


  **What this subtracts from the ledger.** Finding 31 is now `status: reverted` and appears in its
  own report section rather than under Rejected, because it was not rejected: it was measured,
  correct, and worth taking when it landed. `build_report.py` gained that third bucket in this
  commit, and the fact bar breaks it out, because folding a superseded finding into "we looked and
  are not doing it" would misdescribe both the decision and the history.


  **Why this is worth more than two queries.** Tier C is the only tier that changes observable
  behaviour, and the branch had exactly two. Finding 31''s own record documents the trap it carried:
  `TaggedModelSerializerMixin.update` wrote `instance._tags = tags or []` unconditionally, so
  fixing the presence check without the mixin half would have made every REST PATCH that leaves
  tags alone log the object as untagged. That trap is now gone from the branch along with the code.


  **The general lesson, which is finding 60''s and is repeated here because this is where it pays
  off.** Two findings on this branch overlapped for six days without any instrument noticing.
  Each was measured against the tree that preceded it, which is correct procedure; neither could
  see that a later change would strand it. Query counts kept falling and wall clock kept improving,
  so nothing looked wrong — only the attribution was. Counting calls rather than queries is what
  exposed it, and it is worth doing whenever one finding''s subject matter touches another''s.'
