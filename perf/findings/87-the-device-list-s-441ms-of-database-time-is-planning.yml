title: The device list's 441ms of database time is planning, not execution, and no setting fixes it
site: perf/scripts/probe_query_plan.py
summary: '`dcim-api:device-list` at `?depth=1` is the slowest endpoint left on the read surface:
  658ms in-process, 1,083ms p95 over HTTP, of which **441ms is database time across only 11
  queries**. Every other read averages under 3ms per query, so the natural readings are a missing
  index or a sequential scan.


  It is neither. `EXPLAIN (ANALYZE, BUFFERS)` puts **427-470ms in planning and 4.4ms in
  execution** for a single query. PostgreSQL spends a hundred times longer deciding how to run it
  than running it.'
result:
  the_split: 'reproduced across separate runs: planning 470.4ms then 427.5ms, execution 4.4ms
    both times. Every other query the endpoint issues plans and executes in under a millisecond.
    Django reports 453-459ms of database time for the request, essentially all of it this one
    query''s planning.'
  the_query: '**19 JOINs across 18 distinct tables, 260 columns, 10KB of SQL.** That is the shape
    finding 62 describes: at `?depth>=1` the nested serializer renders the whole related object,
    so the optimizer keeps the JOIN rather than prefetching, and Device reaches 16 foreign keys
    with two of them -- `primary_ip4` and `primary_ip6` -- landing on the same wide table.'
  no_index_is_missing: 'every scan is an index scan or a sequential scan over a handful of rows;
    the largest sequential scan in the plan touches 3 rows. Row estimates match actuals at 1.0x
    on the hottest node. Buffers are **597 hit, 0 read** -- the whole working set is in cache.
    There is nothing here for an index or an `ANALYZE` to fix.'
  tuning_makes_it_worse_in_both_directions: 'two hypotheses, both measured, both wrong:

      join_collapse_limit  geqo_threshold   planning    execution
      8 (default)          12 (default)      381.7ms       4.0ms
      20 flatten           12                2952.7ms      3.8ms
      20 flatten           64 (geqo off)     backend killed
      8                    10                387.4ms       4.0ms
      8                     8                3085.3ms      3.6ms
      8                     6                3394.3ms      3.6ms
      8                     2                3427.2ms      3.6ms

    Flattening the join list is 7.7x worse, and flattening with GEQO disabled exhausted the
    backend outright -- PostgreSQL restarted it and recovered cleanly. Lowering `geqo_threshold`
    to or below `join_collapse_limit`, so the genetic optimizer takes groups the standard planner
    would otherwise handle, is 8x worse.'
  why_geqo_loses: 'GEQO exists to avoid exponential blowup at high relation counts, but the
    standard planner uses dynamic programming, which is efficient for the groups of eight that
    `join_collapse_limit` produces. The genetic search carries fixed population-and-generation
    overhead that dominates at that size. **The defaults are already the best of the settings
    tested, and `join_collapse_limit = 8` is what holds this at 390ms rather than three
    seconds.**'
wall_clock: "not measured: an attribution of existing cost, proposing no change"
basis: EXPLAIN (ANALYZE, BUFFERS) over the endpoint's queries, plus a planner-setting sweep
controls: 'the setting sweep re-runs the same captured SQL five times per configuration and takes
  the median, with execution time reported alongside planning so a cheaper plan that runs worse
  would be visible. Execution never moved: 3.6-4.0ms across every configuration. The probe
  discards one warm request before capturing, so process-level caches are not attributed to the
  plan.'
tests: n/a; measurement only, no product code
caveat: 'The 390ms is not fully accounted for. Dynamic programming over groups of eight should be
  cheaper than this, so something else in planning an 18-relation, 260-column query is
  expensive -- target list construction and equivalence classes are candidates, and neither was
  measured. What is established is where the time is, not the last layer of why.


  Measured on one dataset and one PostgreSQL version. Planning cost is a function of query shape
  rather than row count, so it should reproduce on any instance serving this endpoint, but that
  is an expectation rather than a measurement.


  The setting sweep used session-level `SET`, so nothing persists; the killed backend was one
  connection, and PostgreSQL''s crash recovery brought it back with the dataset intact
  (2,902 devices, app serving 200).'
note: '**This corrects finding 62''s stated mechanism, and the correction points at the same
  fix.** That finding attributes the Device queryset''s 447ms to row width -- "copying its columns
  into every base row", 32 columns to 212. The plan says execution is 4.4ms, so the columns were
  never the expensive part. What collapses when you stop joining is the *planning* of an
  18-relation join. Its remedy was right and its explanation was not, which matters because the
  explanation is what people reason from next.


  **It also sharpens what prefetching at `?depth>=1` would buy.** Finding 62 changed only
  `?depth=0`, on the reasoning that at depth 1 the joined columns are genuinely read so the JOIN
  is justified. That reasoning is about data volume and is beside the point: one 390ms plan would
  become roughly sixteen plans of about 0.1ms each. The data delivered to the client is identical
  either way.


  **Every cheap fix is now eliminated rather than untried**, which is the useful part of a
  negative result. No index, no `ANALYZE`, no planner setting. The only lever left is joining
  fewer tables.'
