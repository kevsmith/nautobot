title: Route natural_key() through the ancestor walk Nautobot had already optimized
site: nautobot/core/models/__init__.py - nautobot/ipam/models.py - nautobot/dcim/models/devices.py
summary: 'BaseModel.natural_key() resolves parent__parent__parent__name with plain attribute
  access, one lazy foreign-key load per level. TreeQuerySet.ancestors() already solves that
  exact walk -- it pulls ANCESTOR_JOIN_DEPTH=4 levels per query with select_related and
  deliberately populates each instance''s foreign-key cache so later parent reads are free
  (finding 10). The two were built to compose and nothing wired them together. Calling the
  optimized walk once before the traversal, plus natural_key_map_enabled on the three unmapped
  models a new screen ranked highest, removes 11,674 queries from a datacenter apply.'
