title: Prepared statements on psycopg 3 remove the device list's planning cost
site: development/nautobot_config.py `DATABASES["default"]["OPTIONS"]`
summary: 'Finding 87 put about 450ms of every device-list request in Postgres planning one
  19-join query, with no index or planner setting that helps. psycopg2 binds parameters on the
  client, so Postgres parses and plans every execution. psycopg 3 with `server_side_binding`
  sends the parameters separately, and with `prepare_threshold` set it prepares a statement once
  a connection has run it that many times; Postgres then reuses a generic plan.


  The configuration that does it is database `OPTIONS` only, with no change under `nautobot/`:
  `{"pool": true, "server_side_binding": true, "prepare_threshold": 5}`. The pool is required
  because a prepared statement lives on its connection, and Django''s pool requires
  `CONN_MAX_AGE=0`. Django sets `prepare_threshold` to None unless `OPTIONS` names it, so
  `server_side_binding` on its own prepares nothing.


  **Held off `perf/recommended` by decision.** Adopting it needs psycopg 3 in `poetry.lock`; on
  the rig it was installed into a separate path inside the container and selected per arm. The
  full suite has not been run on the swapped driver.'
