caveat: 'Tier B2: plans now outlive the request, cached per pooled connection. A generic plan
  ignores parameter values, so on a skewed filter it can be slower than a custom one; this dataset
  showed execution time flat or lower in D, which does not cover a customer''s distribution.
  `plan_cache_mode` is the control. psycopg caps each connection at 100 prepared statements
  (`prepared_max`), evicted least recently used; how many distinct statement texts the whole
  product issues was not counted. Behind PgBouncer this needs 1.21 or later in transaction mode
  with `max_prepared_statements` above 0, queued separately. The pool also changes connection
  behaviour on its own: each worker holds its connections, where the rig opened one per request.'
