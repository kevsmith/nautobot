note: 'This is the read-path counterpart to finding 39, and it lands the same way. There,
  a −33.7% write win was spread across 40 models with no single finding accountable, and query
  count would have rated the work at −13%. Here, an 18.6% median win on the request users
  spend most of their time waiting for is invisible to query count entirely -- not undervalued,
  invisible, because the counts are identical to the query.


  **It also settles a contradiction that was open for most of a day.** Two readings of the
  chrome cost disagreed: a browser session under load put the 404 at 274ms and a zero-row
  list document at 357ms, making chrome the dominant term; the committed quiet-box numbers
  put ui.search at 81ms with identical chrome, making the per-model term dominant. On a gated
  box the 404 is **82ms**, within a millisecond of ui.search, so the committed reading was
  right and the browser figures were inflated 3.3x by a test suite competing for the same
  cpuset. The lesson is not that the browser was the wrong instrument -- it found finding
  44, which nothing else could have -- but that a measurement taken outside the quiesce gate
  cannot arbitrate between two that were taken inside it.


  **What this does not say.** The aggregate sums per-endpoint medians with every endpoint
  weighted equally, which is the same method the write screen uses, so the two rows in the
  report are comparable to each other. It is not traffic-weighted, and nothing in this harness
  knows the traffic mix. A −31.9% summed figure is not a claim that any particular user gets
  31.9% of their time back.



  **A mechanism I proposed and the data did not support.** I attributed this to findings 07
  and 11 -- the caching TemplateColumn -- on the strength of the biggest movers being dcim
  and ipam tables, which is what finding 11 converted. Tested properly by counting TemplateColumn-derived
  columns per table class and correlating against improvement, it comes out at **pearson +0.09,
  spearman +0.05**: no relationship. The counter is also not trustworthy -- it reports zero
  columns for CableTable and InterfaceTable, which plainly have them, so those tables build
  columns somewhere a static walk cannot see. Either way the attribution is unproven, and
  what the data does support is the magnitude relationship above. This is the sixth hypothesis
  on this branch formed by reading code and killed by measuring, and the first one where the
  eyeballed pattern was a genuine correlation with the wrong variable: the big movers really
  are dcim and ipam tables, and they are also the expensive ones.'
