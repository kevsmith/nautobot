note: 'The queue proposed answering this by reverting finding 13 alone and re-timing. That would
  have given one number and a yes/no. Running the write screen against both arms instead gives
  the per-model breakdown above for the same machine time, and the answer it produces is not the
  one the yes/no would have suggested: no single finding accounts for the win, so there is no
  finding-13-shaped thing for the write matrix to go hunting.


  **The most useful number here is the one that took the longest to see.** 662 seconds saved and
  2.9 of them are database execution. Every instrument on this branch until now has gated on
  query count, and query count would have rated this work at −13% when it is worth −31%. The
  read side does not behave this way -- there, db time and query count track each other closely
  (finding 38). The write path is where they come apart, and any future write experiment should
  report both or it will undervalue exactly the kind of fix this branch is best at.


  **What is still not measured.** Both applies here carry the finding 40 timeout waste, so the
  raw −31.3% is diluted by a constant that has nothing to do with Nautobot. The adjusted −40.5%
  is arithmetic on a counted constant (16 fallbacks x 30s), not a measured quantity. databot now
  defaults to a 120s write timeout, so re-running the A/B against a rebuilt databot would replace
  the inference with a measurement. Worth doing; nothing else on the branch depends on it.'
