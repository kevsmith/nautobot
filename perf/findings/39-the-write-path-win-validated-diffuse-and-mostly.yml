controls: 'Arms alternated (pilot A, B, A, B) and the tree proved different before each run by
  hashing nautobot/**/*.py, not by trusting the checkout -- the rule that exists because a git
  stash A/B once silently measured identical code six times. Only nautobot/ is swapped, since
  perf/ and development/docker-compose.perf.yml do not exist on next; all 37 differing files are
  modifications, no adds or deletes, so a path-scoped checkout is an exact swap both ways. The
  checkout is unstaged immediately, because a staged reversion left lying around is how five
  fixes were undone once. Each arm starts from a byte-identical empty migrated database cloned
  from a template, the container is restarted (uwsgi has no autoreloader, so without it the next
  request runs the previous arm''s code), and the run waits for loadavg to fall below 0.7 before
  starting -- finding 35, where three uwsgi workers importing Nautobot on two pinned cores biased
  a whole arm bimodally.'
