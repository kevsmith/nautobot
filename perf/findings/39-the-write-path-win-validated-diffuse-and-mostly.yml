title: The −37% write-path win is real, diffuse, and mostly not SQL
site: perf/screen_writes.py - whole-workflow databot apply
summary: 'Queue item 1, answered. Kevin measured a datacenter dataset apply at 495s against
  perf/verified versus 786s against stock next, on his own hardware, single runs. Reproduced
  here as a controlled A/B on the measurement host: same box, same dataset (datacenter/large,
  seed 42, 11,578 rows), arms alternated, and the two trees proved different by content hash
  before each run (a586fc5cf against e308df687). The win is real. It is spread across 40
  models rather than concentrated in one finding, and 99.6% of the time it saves is not
  database execution time.'
