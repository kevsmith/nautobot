note: '**Two departures from the imported version, both deliberate.**


  **The script prefix is part of both memo keys.** `reverse()` embeds the thread-local script prefix
  in the path it returns, and these memos are process-lifetime rather than request-scoped, so a
  process serving more than one script prefix would otherwise hand one deployment''s prefix to
  another. Their version keys on `(model, api, urlconf)` only. This is a hazard that would not show
  up on any instance that mounts Nautobot at a single path, which is most of them — hence a key
  rather than a caveat.


  **`get_absolute_url()` keeps its original per-object walk as the fallback.** Their rewrite raises
  `AttributeError` when the route reverses but does not contain the pk; ours memoizes `None` for
  that case and takes the old path, so a model whose detail route does not embed its pk behaves
  exactly as it did before.'
