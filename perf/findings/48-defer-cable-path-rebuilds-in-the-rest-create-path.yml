  Neither gate instrument can see this change. The write screen''s generated cable payload leaves
  both terminations null (finding 40), so the loop never runs -- which is the same reason the
  screen reads dcim.cable at 44.9 queries per object against ~220 for a real one. Tier 1W has no
  cable operations at all. The measurement had to come from a probe that posts real terminations,
  perf/scripts/probe_defer_cable_paths.py.


  Not taken here, and logged in queue.md as *Nested transactions on the write path*: the +3
  overhead splits 2:1. Removing the re-fetch is the smaller half and the only part that can
  produce a wrong answer -- CableViewSet prefetches terminations (api/views.py:815), so on an
  update the instance arrives with a cache the loop invalidates, and rebuild_paths reads
  obj.terminations.all(), so using the caller''s instance unguarded would build paths from a stale
  termination set with no error anywhere. The savepoint half is larger, has no correctness
  surface, and carries exact predictions from this control: one-ended 128 -> 126, two-ended
  195 -> 193.'
