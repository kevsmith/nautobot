summary: 'Queue item 5. Every CableToCableTermination write fires
  rebuild_paths_on_join_change, which outside a deferral calls rebuild_paths() per row, so a
  two-ended cable rebuilt its paths twice. defer_cable_path_rebuilds() was already adopted at
  dcim/forms.py:4900 and dcim/models/cables.py:1023; _apply_terminations() was the caller left
  out, making this the fourth instance of the shape after findings 7/11, 34 and 36. The two
  rebuilds are not equal and that is why the size could not be predicted: the first sees a
  half-terminated cable and the second the finished one, so coalescing keeps the expensive one
  and the saving is not half the total.'
