note: 'How it was nearly believed. In the finding 34 A/B the control read +73% in the patched
  arm at all three page sizes, with 8 queries in both arms, in all three rounds. Consistency
  read as signal. It was not -- rerunning the same arm six times reproduces the full 99-177ms
  range without changing a line of code, and the first A/B simply landed arm B in the fast
  mode three times and arm A in the slow mode three times.


  This is the second time on this branch that a deterministic-looking bias survived arm
  alternation. Finding 32 was the first, a gen-2 GC pause recurring on a period fixed per
  tree, so it lands on the reported rep for one arm and not the other in every independent
  run. Both share a shape worth naming -- arm reversal cancels drift, and cancels nothing
  keyed to something other than time.


  Two fixes, and the first is the real one. An in-process probe never needed the restart.
  Tier 1 and Tier 1W spawn a fresh Python process per run and pick up synced code without
  one; only uwsgi-served measurement needs a restart, because uwsgi holds imported modules.
  The A/B that produced this was restarting between arms for no reason and paying a bimodal
  artifact for it.


  Second, sync.sh --restart now waits for the container to report healthy and then for the
  load average to fall under the ceiling before returning, and fails rather than handing back
  a host that is not measurable. Verified -- it refused during an unrelated test run at
  loadavg 1.71.


  What this does not settle is whether earlier numbers on this branch are affected. Any
  wall-clock figure taken through an in-process probe shortly after a restart carries the
  risk. Query counts are unaffected, which is most of the branch evidence, and the affected
  figures would have to be re-taken to know.'
