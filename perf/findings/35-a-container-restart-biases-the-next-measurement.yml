title: A container restart biases the measurement that follows it, and arm alternation does not cancel it
site: perf/sync.sh - perf/probe_ui_only.py
summary: 'perf/dc.sh restart returns when the container has started, not when it is ready.
  uwsgi then forks three workers that each import Nautobot, and the nautobot container is
  pinned to two physical cores (cpuset 0,1,4,5). An in-process probe launched into that
  window competes with those imports for the cores it is being measured on. The result is
  bimodal: the same view reads either ~99ms or ~165ms depending on where the probe lands,
  the mode is set at process start and then holds for the whole arm, and three alternating
  rounds does not cancel it.'
result:
