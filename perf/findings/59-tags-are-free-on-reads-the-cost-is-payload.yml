title: Tags are free on the read path, and the tagged dataset exists for the write path
site: perf/snapshot-large-tags.sql — perf/scripts/probe_tag_surface.py, probe_tag_cost.py
summary: '`extras-api:tag-list` returns zero rows in the baseline dataset, which meant finding 31
  — a tier C change to `serialize_object`''s tag cache — was measured entirely on the untagged
  path. A second snapshot was built to close that gap. Before spending a full read/write pass on
  it, the question of whether tags are visible to the read instruments at all was measured: they
  are not, in the sense that matters. A serializer touches `obj.tags` per row whether or not any
  tags come back, and the upstream queryset optimizer''s `TagsField` branch already batches that
  into **exactly one prefetch per request at any page size**. So the zero-tag dataset was already
  paying the query and merely receiving nothing. Tags add payload, not queries.'
result:
  dataset_ab: 'same arm (stock `e308df687`), same host, only the snapshot changed.
    `interfaces?limit=25` 21 -> 21 queries and 46,295 -> 45,869 bytes; `interfaces?limit=100`
    22 -> 21 and 189,521 -> 200,218 (+10.7KB); `interfaces?limit=100&depth=1` 1,228 -> 1,217 and
    883,238 -> 930,881 (+47.6KB); `devices?limit=100` 7 -> 7 and 207,642 -> 208,095;
    `object-changes?limit=25` 29 -> 29 and byte-identical. Query deltas run 0 to −11 — at or below
    the noise the VLAN renumbering introduces — and every delta that is not zero is negative,
    which is not a saving from tags but dataset drift.'
  tag_queries: '**one** `extras_taggeditem` query per request on every shape measured, at limit 25,
    50 and 100 and at depth 0 and 1. There is no N+1 here to find on either arm.'
  rendered_surface: 'tag coverage correlates with default ordering, so page size decides whether an
