wall_clock_detail: 'The probe records in-process milliseconds and they are noisy enough to be
  useless here: `interfaces?limit=25` read 956.0 ms on the baseline and 590.2 ms on the tagged
  snapshot, which is a restore-warmth artifact rather than a tag effect, since the same request
  issues the same 21 queries against both. No Tier 2 pass was run, deliberately: with query count
  flat and the payload difference under 48KB on the largest shape, there is nothing a wall-clock
  figure could establish that the query and byte columns have not.'
note: '**The instinct to characterise a new dataset with a full pass was wrong here, and measuring
  first cost fifteen minutes instead of five hours.** The reasoning that nearly justified the pass
  — 67% of interfaces are tagged, so tag-touching endpoints must have changed — was defeated by two
  independent facts, each sufficient on its own: the optimizer already batches the tag fetch, and
  the instruments'' page size renders almost no tagged rows.


  **The page-size trap is the part worth carrying forward.** Tag coverage in this dataset
  correlates with default ordering, so any paginated measurement''s exposure to tags depends on its
  page size. An instrument at `limit=25` sees one tag object across interfaces and devices
  combined; the same instrument at `limit=100` sees 64. That is a property of the dataset, not of
  Nautobot, and it is arguably worth raising with the databot work — tag coverage that correlates
  with ordering makes every paginated measurement page-size dependent.


  **What the tagged snapshot is still for.** Finding 31 fixed `serialize_object`''s tag cache,
  where `tags = getattr(obj, "_tags", []) or obj.tags.only("name")` fell through for an object
  whose cached tag list was empty. With zero tags in the dataset, `_tags` was always `[]` and
  always falsy, so **the branch that the fix enables has never executed in any measurement on this
  branch**. Its recorded −6.9% describes the untagged path only. That is a write-path question —
  `serialize_object` is called when change-logging — so it needs writes against tagged objects,
  which is the next experiment rather than this one.


  Provenance and restore instructions for the snapshot are in
  `perf/snapshot-large-tags.provenance.md`, including the hazard that `expected-counts.txt` cannot
  distinguish the two datasets: they match on all four models it records.'
