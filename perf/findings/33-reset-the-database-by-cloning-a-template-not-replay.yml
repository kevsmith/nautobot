title: Reset the database by cloning a template, not by replaying the snapshot
site: perf/reset_db.sh - perf/probe_clone_warmup.sh
summary: restore_snapshot.sh takes 49 seconds, and four of its five phases are things a
  measurement loop does not need every iteration. CREATE DATABASE ... TEMPLATE copies the
  files instead, which returns the database to baseline in 1.3 seconds with the app left
  running. Per-operation isolation stops being something to design around and becomes
  something to buy every iteration.
