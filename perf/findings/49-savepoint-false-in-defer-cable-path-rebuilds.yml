title: savepoint=False in defer_cable_path_rebuilds() — measured, works, rejected on the trade
site: nautobot/dcim/signals.py defer_cable_path_rebuilds
summary: 'defer_cable_path_rebuilds() opens its own transaction.atomic(). On a REST cable
  create it is entered twice -- once from Cable.save() materializing initial terminations and
  once from CableSerializer._apply_terminations -- and `in_atomic_block` is True at both entry
  points, so both savepoints are nested inside DRF''s perform_create transaction. A savepoint
  only earns its two statements if something catches an exception raised inside the block and
  then continues; transaction.atomic(savepoint=False) keeps the all-or-nothing guarantee,
  enforced by whichever transaction is outermost, and emits no SQL when nested. The change is
  one argument. It works, it is exactly as large as predicted, and it was still rejected.'
