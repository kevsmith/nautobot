reason: '**Rejected on the trade, not on the measurement.** −4 queries of 195 is ~2%, against
  narrowing a documented guarantee whose failure mode is silent. The precedent is the rejected
  FK pre-warming: −666 queries and 62% slower. The ratio here is worse than that one.

  What failed is `test_defer_rolls_back_on_exception`, whose docstring names the exact
  inconsistency it prevents -- "rows committed, paths stale". It raises inside the block,
  catches with assertRaises, then queries to assert the row was rolled back. Django''s TestCase
  wraps each test in a transaction, so with a savepoint the rollback is local and the test
  transaction stays usable; with savepoint=False the test transaction is marked broken and the
  verifying query raises.

  So the catch-and-continue caller is the test, and the audit of product callers stands: none of
  the three catch. Two readings, and the branch took the second. Either the test asserts an
  implementation detail and should assert the guarantee some other way -- TransactionTestCase,
  or checking the connection is marked needs_rollback -- or independent rollback is part of the
  contract. Someone wrote a named test with a docstring citing the failure mode, which is a
  deliberate choice, and 2% does not buy the right to narrow it.

  Reproducible: the change is preserved on `perf/exp-savepoint-false` at 0764662dd, one
  argument on one line in defer_cable_path_rebuilds().'
note: 'Two things this experiment found that outlive its rejection.

  **Cable.save() enters the deferral and writes nothing on the REST path.** Measured:
  cables.py:1023 rows_saved=0, serializers.py:1236 rows_saved=2. The serializer pops the legacy
  termination_a/b fields into its own entries before the model is constructed, so
  _materialize_initial_terminations() opens a transaction, materializes zero rows, and exits.
  The two methods are not redundant -- one takes two generic FKs by attribute assignment, the
  other a terminations payload with cable_end and connector for breakout lanes -- but one of
  them runs empty on every REST cable create.

  **Nothing in the codebase distinguishes the two things atomic() does.** 61 transaction.atomic()
  call sites in nautobot/ outside tests, and zero use savepoint=False, while one cable create
  sits 6 savepoint pairs deep. ATOMIC_REQUESTS is unset, so those are genuine transaction
  boundaries rather than decoration -- roughly 32 are view-level and 22 are outside the request
  path entirely (dcim/signals.py 5, ipam/models.py 3, core/jobs 3, dcim/models/cables.py 2,
  plus management commands, the git datasource and the CLI). See the queue candidate.'
