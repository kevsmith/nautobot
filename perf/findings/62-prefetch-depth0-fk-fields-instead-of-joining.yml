    columns, 16 FKs); Interface 94 -> 24ms (9 FKs); Prefix 88 -> 25ms (7 FKs); IPAddress 24 -> 13ms
    (5 FKs). The cost scales with FK count and related-row width, which is why it is dramatic on
    Device and modest on IPAddress.'
