title: Prefetch depth-0 FK serializer fields instead of JOINing them
site: nautobot/core/api/views.py ModelViewSetMixin.get_queryset — nautobot/core/tests/test_api.py
summary: 'At `?depth=0` a DRF `RelatedField` renders a hyperlink or a natural key, never the related
  row, so DRF''s pk-only optimization leaves every joined column unread — yet the optimizer
  `select_related`s each one, copying its columns into every base row. On Device that is 16 foreign
  keys widening a row from 32 columns to 212. Prefetching instead fetches each related object once.
  Nested serializers at `?depth>=1` keep the JOIN, because they render the whole related object and
  every joined column is read. A relation the viewset joined explicitly stays joined.


  **Ported from Ken Celenza''s `2faf6adad` (`API | Generic | 1`) on
  github.com/itdependsnetworks/nautobot**, taking its first part only; that commit also adds nested
  prefixed prefetches and a recursion budget, which are separate experiments.'
result:
