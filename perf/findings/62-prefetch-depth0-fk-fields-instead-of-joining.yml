wall_clock_detail: 'The two figures answer different questions and both belong in the headline.
  −63.4% is what the most-requested endpoint in a typical deployment does; −17.4% is the aggregate
  over all 11 `api.*` scenarios, which is what a workload gets. The whole-workload −5.1% is
  reported in the record but not headlined, because 46 of its 57 scenarios are UI paths the change
  provably cannot reach, and averaging over them measures the scenario mix rather than the change.


  **The read screen and Tier 2 disagree in magnitude and both are right.** In-process the wall
  aggregate moves −2.0% while database time moves −15.7%: the saving is database-side row
  transfer, and Python serialization dominates most of the 516 measurements. Over HTTP, on the
  scenarios that actually fetch wide rows, it is −17.4%.'
note: '**The query counter reads this change as a regression and must not be the gate.** Queries
  rise by design, one per prefetched relation: +5.4% on the read screen, with 140 measurements
  worse and 1 better. Those 255 extra queries buy 746 ms of database time. This is the third
  finding on this branch where the deterministic counter cannot see the result — finding 51 had to
  gate on URL reversals because no query moved, and finding 58 on content hash and cache-key
  presence because a cache read is not SQL. The rule that query count is the gate holds for N+1
  work and fails for anything that trades round trips against row width.


  **A correction, recorded because the reasoning was published before it was checked.** An earlier
  reading of this experiment reported `api.device.detail.depth1` as a stable +3.8% regression and
  attached a mechanism: that prefetching is worse for single-row responses, where a JOIN duplicates
  nothing. In-process that endpoint reads 165.8 -> 165.0 ms — flat — and detail actions as a class
  improve 4.3%. The Tier 2 figure was HTTP-layer noise, and the mechanism was invented to explain
  it. That is the second time in one session a mechanism was offered ahead of the measurement that
  could settle it; the first was the tag-cache path in finding 60.


  **What is still on the table from the same upstream commit.** `2faf6adad` also adds
  `_nested_serializer_prefetches` — prefixed prefetches covering a nested serializer''s own foreign
  keys, natural-key walks and model-declared traversal prefetches at `?depth>=1` — and recursion
  through deeper levels bounded by `NESTED_PREFETCH_BUDGET = 150`. Its claim there is circuits at
  `depth=1` going 2,063 -> 23 queries. This branch measures `circuits-api:circuit-list list.depth1`
  at 356 -> 183 queries against stock, so the shape is present in our data and unfixed; it is the
  next experiment, not this one.'
