wall_clock_detail: 'Both figures come from three alternating rounds (A/B, B/A, A/B) on a quiesced
  host through measure.sh. The HTTP measurement is cassowary at n=30 c=1 with the client on
  hannah''s localhost, which keeps both the LAN and client CPU contention out of the numbers; the
  containers'' cpuset pinning keeps the client off the app''s cores.


  **The HTTP figure is larger than the in-process one and that is not explained.** The prediction
  was the reverse — the page is ~161ms in-process and ~202ms over HTTP, so uwsgi''s fixed overhead
  should have diluted the percentage to about −9%. Instead the absolute saving grew from ~25ms to
  ~31.5ms. The plausible candidate is that 28 fewer round trips release the worker sooner in a way
  the in-process test client does not model, but that is a hypothesis and three hypotheses about
  this page were already wrong today, so it is recorded as unexplained rather than rationalised.


  −15.6% (HTTP median) is the figure to quote, because the report''s cumulative table is measured
  over HTTP and mixing the two tiers would overstate or understate depending on which was picked.'
note: '**The shipped test was vacuous in its first form, and the mechanism is worth recording
  because nothing about it looked wrong.** `panel_changelog.html` gates on
  `perms.extras.view_objectchange`, and `nautobot/core/testing/mixins.py:61` creates the test user
  with no permissions at all. So the panel rendered "No permission", none of the twelve
  `ObjectChange` rows the test had created was ever touched, and both query assertions passed
  against incidental content-type queries from elsewhere on the page. The test reported a confident
  result while exercising nothing — and it was caught only because the *strong* assertion (the GFK
  one) passed with the fix reverted, which should have been impossible.


  Fixed by granting the permission and asserting two preconditions — that the panel rendered at
  all, and that it rendered these specific rows — so the test now fails loudly rather than silently
  when its own setup stops holding. With the fix reverted it reads 10 `dcim_location` queries for
  twelve rows against a threshold of 2.


  The content-type assertion was dropped rather than kept. Django''s `ContentType` manager caches
  by id, so it read 3-for-12-rows in the test environment against 15-for-15-rows in production;
  guarding on a 3-versus-2 margin that the test environment produces incidentally is not a guard.


  **A process failure worth naming alongside it:** the test was written, committed, and the A/B
  launched without the test ever having been run. The measurement discipline held all day and the
  test gate did not.


  **Two hypotheses about this page were wrong before the right one.** That `<string>` template cost
  was compilation — it is 3.3ms of 61.2ms. And that the panel callbacks were eagerly evaluated
  integers — true of the three dcim connection counts, false of `get_changelog`,
  `get_job_results` and `get_approval_workflow_stages`, which all return sliced querysets. The
  latter two have the same shape as this finding and are unfixed: `get_job_results` selects a
  `user` FK without `select_related`, and the dataset holds only 2 JobResults so its cost cannot be
  measured here.'
