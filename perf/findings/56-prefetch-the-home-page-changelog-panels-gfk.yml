title: Prefetch the home page changelog panel's generic foreign key
site: nautobot/extras/homepage.py get_changelog — extras/templates/extras/inc/panel_changelog.html
summary: '`get_changelog()` returns an unevaluated sliced queryset which the panel template then
  renders, and `ObjectChange.changed_object` is a GenericForeignKey over the `changed_object_type`
  FK — so every rendered row cost a content-type lookup *and* an object lookup. Full stacks put it
  at 15 content-type queries and 10 object queries for a 15-row panel, ~25 of the home page''s 79.
  `select_related` on the FK folds the first set into the main query; `prefetch_related` on the GFK
  batches the second by content type, so object lookups collapse to one query per distinct type
  however many rows render.'
